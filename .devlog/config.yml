project: yeonbora-site
# Phase 2 완료 전까지 게시 대상은 기존 Jekyll 깃블로그
publish_target: jekyll
current_phase: 1
phases:
  - id: 1
    title: 허브 화면
    goal: 로컬에서 6칸 아이콘 허브가 뜬다
    done:
      - pnpm dev 로 로컬 실행
      - 6칸 아이콘 허브 (데스크톱 3 x 2, 모바일 2 x 3, 호버 효과 + 모바일 동작)
      - 아이콘 클릭 시 섹션 빈 페이지로 전환
  - id: 2
    title: 콘텐츠 모델 + 깃블로그 이전
    goal: 기존 깃블로그 글이 새 스키마로 읽힌다
    done:
      - courses · posts 스키마 확정
      - 수강 과목 목록 입력
      - Jekyll 글을 content collection으로 이전
      - 과목 / 글 페이지 · 서재 목록
      - 태그 · RSS · sitemap
      - devlog 스킬 게시 경로를 Astro로 변경
  - id: 3
    title: 애드센스 준비
    goal: 도메인만 연결하면 바로 신청할 수 있는 상태가 된다
    done:
      - ads.txt
      - 소개 · 개인정보처리방침 페이지
      - canonical 방침 적용
  - id: 4
    title: 학교 방
    goal: 학년에서 과목을 찾아 들어간다
    done:
      - 1 ~ 5학년 색 막대 계단 레이아웃
      - 학년 칸이 화면 전체로 확장되며 과목 목록
      - 과목 클릭 시 과목 페이지
      - 모바일 대응
  - id: 5
    title: 컴퓨터 방
    goal: 컴퓨터 화면에서 글을 찾아 읽는다
    done:
      - 바탕화면 + 아이콘 + 창 레이아웃
      - 아이콘 클릭 시 글 목록
      - 학교 방과 같은 과목 페이지로 연결
      - 모바일 대응
  - id: 6
    title: 철학 방
    goal: 초상화 갤러리에서 사상가 글을 읽는다
    done:
      - 초상화 갤러리 레이아웃
      - 사상가 클릭 시 정리 글
      - 사상가 3명 이상
      - 모바일 대응
  - id: 7
    title: 종교학 방
    goal: 금속 뱃지에서 종교별 글을 읽는다
    done:
      - 종교 상징 금속 뱃지 + 반짝임 효과
      - 뱃지 클릭 시 정리 글
      - 종교 3개 이상
      - 모바일 대응
  - id: 8
    title: 흩어진 출처 수집
    goal: 나머지 플랫폼의 정리본이 모인다
    done:
      - Notion · velog · Tistory 글 가져오기
      - 종이 정리본 1편 이상 스캔 + 전사
      - 모두 공통 스키마로 서재와 각 방에 표시
  - id: 9
    title: 첫 인터랙티브 글
    goal: 글 안에서 시각화가 동작한다
    done:
      - MDX 글 1편에 React 시각화 삽입
      - 모바일에서 조작 가능
      - Lighthouse 성능 90 이상
  - id: 10
    title: Algoristro workspace 통합
    goal: 시각화 백과사전이 사이트 안에서 열린다
    done:
      - Algoristro를 packages/로 이전
      - /algo 경로로 함께 빌드
      - 글과 상호 링크
  # 배포와 도메인은 비용이 들어서 마지막에 연결한다 (2026-11-24 결정)
  - id: 11
    title: 배포 + 도메인 + 애드센스 신청
    goal: 내 도메인에서 사이트가 뜨고 광고 심사가 시작된다
    done:
      - main push 시 Cloudflare Pages 자동 배포
      - 도메인 구입 후 HTTPS 접속
      - astro.config.mjs 의 site 를 실제 도메인으로 변경
      - canonical · sitemap · RSS 주소 갱신
      - 애드센스 신청 완료

project: yeonbora-site
# M4 (깃블로그 이전) 완료 전까지 게시 대상은 기존 Jekyll 깃블로그
publish_target: jekyll
current_phase: 1
# 글 옮기기 프로젝트 (docs/migration/project-instructions.md) 의 현재 Phase
current_migration_phase: M1
phases:
  - id: 1
    title: 허브 화면
    goal: 로컬에서 6칸 아이콘 허브가 뜬다
    done:
      - pnpm dev 로 로컬 실행
      - 6칸 아이콘 허브 (데스크톱 3 x 2, 모바일 2 x 3, 호버 효과 + 모바일 동작)
      - 아이콘 클릭 시 섹션 빈 페이지로 전환
  - id: 2
    title: 과목 · 서재
    goal: 옮겨진 글을 과목과 서재에서 찾는다
    # 스키마 · Jekyll 이전 · devlog 게시 경로 변경은 글 옮기기 프로젝트 M1 · M4 로 이관 (2026-11-27)
    done:
      - 수강 과목 목록 입력
      - 과목 페이지 · 서재 목록
      - 태그 · RSS · sitemap
  - id: 3
    title: 애드센스 준비
    goal: 도메인만 연결하면 바로 신청할 수 있는 상태가 된다
    done:
      - ads.txt
      - 소개 · 개인정보처리방침 페이지
      - canonical 방침 적용
  - id: 4
    title: 학교 방
    goal: 학년에서 과목을 찾아 들어간다
    done:
      - 1 ~ 5학년 색 막대 계단 레이아웃
      - 학년 칸이 화면 전체로 확장되며 과목 목록
      - 과목 클릭 시 과목 페이지
      - 모바일 대응
  - id: 5
    title: 컴퓨터 방
    goal: 컴퓨터 화면에서 글을 찾아 읽는다
    done:
      - 바탕화면 + 아이콘 + 창 레이아웃
      - 아이콘 클릭 시 글 목록
      - 학교 방과 같은 과목 페이지로 연결
      - 모바일 대응
  - id: 6
    title: 철학 방
    goal: 초상화 갤러리에서 사상가 글을 읽는다
    done:
      - 초상화 갤러리 레이아웃
      - 사상가 클릭 시 정리 글
      - 사상가 3명 이상
      - 모바일 대응
  - id: 7
    title: 종교학 방
    goal: 금속 뱃지에서 종교별 글을 읽는다
    done:
      - 종교 상징 금속 뱃지 + 반짝임 효과
      - 뱃지 클릭 시 정리 글
      - 종교 3개 이상
      - 모바일 대응
  - id: 8
    title: 흩어진 출처 수집 (이관됨)
    goal: 글 옮기기 프로젝트 M5 · M6 으로 이관 (2026-11-27)
    done:
      - 글 옮기기 프로젝트 M5 · M6 완료
  - id: 9
    title: 첫 인터랙티브 글
    goal: 글 안에서 시각화가 동작한다
    done:
      - MDX 글 1편에 React 시각화 삽입
      - 모바일에서 조작 가능
      - Lighthouse 성능 90 이상
  - id: 10
    title: Algoristro workspace 통합
    goal: 시각화 백과사전이 사이트 안에서 열린다
    done:
      - Algoristro를 packages/로 이전
      - /algo 경로로 함께 빌드
      - 글과 상호 링크
  # 배포와 도메인은 비용이 들어서 마지막에 연결한다 (2026-11-24 결정)
  - id: 11
    title: 배포 + 도메인 + 애드센스 신청
    goal: 내 도메인에서 사이트가 뜨고 광고 심사가 시작된다
    done:
      - main push 시 Cloudflare Pages 자동 배포
      - 도메인 구입 후 HTTPS 접속
      - astro.config.mjs 의 site 를 실제 도메인으로 변경
      - canonical · sitemap · RSS 주소 갱신
      - 애드센스 신청 완료

# 글 옮기기 프로젝트 Phase (docs/migration/project-instructions.md)
migration_phases:
  - id: M1
    title: 콘텐츠 기반
    goal: 노트가 링크로 이어져 뜬다
    done:
      - wiki · posts · courses 스키마
      - remark 플러그인 (링크 · viz · 주석)
      - /wiki · /posts 페이지 + 역링크
      - 샘플 노트 3개 이상
      - content 폴더를 Obsidian 볼트로 열어 확인
  - id: M2
    title: 시안 작업대 + 첫 시각화
    goal: 그림을 보고 고치고 승인한다
    done:
      - /_drafts 목록 (dev 전용)
      - config.json 조절판 저장
      - 본문 · 라벨 텍스트 저장
      - 승인 / 반려 메모
      - 샘플 글 1편에 직접 그린 SVG 또는 애니메이션
      - 휴대폰에서 확인
  - id: M3
    title: 위키 이전
    goal: Main 노트가 사이트에서 열린다
    done:
      - Main 노트 전부 이전
      - 깨진 링크 리포트 0
      - 이미지 정상
      - Main 저장소 보관
  - id: M4
    title: 깃블로그 이전
    goal: Jekyll 글이 사이트에서 열린다
    done:
      - _posts 전부 이전
      - 원작성일 · 출처 유지
      - 위키 링크 연결
      - devlog 게시 경로를 Astro로 변경
  - id: M5
    title: velog · Tistory · Notion 이전
    goal: 흩어진 블로그 글이 모인다
    done:
      - 세 출처 글 전부 이전
      - 출처별 변환 리포트
      - 중복 글 정리
  - id: M6
    title: 종이 정리본
    goal: 손글씨가 글이 된다
    done:
      - 1편 이상 스캔 + 전사
      - 스캔 원본 보관

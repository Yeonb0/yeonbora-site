<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>게임 방 목업</title>
<link rel="stylesheet" href="https://hangeul.pstatic.net/hangeul_static/css/nanum-square.css" />
<link rel="stylesheet" href="https://hangeul.pstatic.net/hangeul_static/css/nanum-square-neo.css" />
<style>
  :root {
    --fg: #e0e0e0;
    --fill: #86198f;
    --line: #333333;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --font-point: 'NanumSquareNeoBold', 'NanumSquareNeo', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { overflow: hidden; user-select: none; background: #120e17; color: var(--fg); font-family: 'NanumSquare', system-ui, sans-serif; }

  .icon-btn {
    position: fixed; top: 20px; z-index: 60; width: 40px; height: 40px;
    display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%;
    background: rgba(26, 26, 26, 0.6); color: var(--fg); cursor: pointer; text-decoration: none;
    transition: opacity 0.5s var(--ease), background 0.4s;
  }
  .icon-btn:hover { background: var(--fill); }
  .home { left: 20px; }
  .back { left: 70px; opacity: 0; pointer-events: none; }
  body.open .back { opacity: 1; pointer-events: auto; }
  .icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

  /* 방 그림 (1536 x 864) 한 장 = 세계. TV 에 손을 대면 이 세계가 TV 화면 쪽으로 확대된다 */
  .world {
    position: fixed; left: 0; top: 0; width: var(--ww); height: var(--wh); transform-origin: 0 0;
    transition: transform 0.9s var(--ease); opacity: 0;
  }
  /* 방 그림 : 시간 · 날씨에 따라 밝기와 색이 바뀐다 */
  .bg { position: absolute; inset: 0; background: var(--scene) 0 0 / 100% 100% no-repeat; image-rendering: pixelated; filter: var(--roomf, none); }
  .tint { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: soft-light; background: var(--tint, transparent); opacity: var(--tinta, 0); }
  /* 창밖 : 그림 속 유리 네 칸만 다시 그린다 (47, 31, 247 x 360) */
  .win { position: absolute; left: calc(47 / 1536 * 100%); top: calc(31 / 864 * 100%); width: calc(247 / 1536 * 100%); height: calc(360 / 864 * 100%); image-rendering: pixelated; pointer-events: none; }
  /* 바닥 창빛 : 달빛 / 햇빛 색 (160, 635, 400 x 105) */
  .patch { position: absolute; left: calc(160 / 1536 * 100%); top: calc(635 / 864 * 100%); width: calc(400 / 1536 * 100%); height: calc(105 / 864 * 100%); image-rendering: pixelated; pointer-events: none; mix-blend-mode: color; }
  /* 고양이 꼬리 : 몇 초마다 살랑 (몸 쪽은 붙어 있고 끝만 휘어 올라간다) */
  .tailcv { position: absolute; left: calc(1478 / 1536 * 100%); top: calc(620 / 864 * 100%); width: calc(58 / 1536 * 100%); height: calc(34 / 864 * 100%); image-rendering: pixelated; pointer-events: none; }
  .tailcv { filter: var(--roomf, none); }
  /* 여자애 패드 버튼 반짝임 자리 */
  .padcv { position: absolute; left: calc(1092 / 1536 * 100%); top: calc(586 / 864 * 100%); width: calc(96 / 1536 * 100%); height: calc(72 / 864 * 100%); image-rendering: pixelated; pointer-events: none; transform-origin: 50% 80%; }
  .flash { position: absolute; inset: 0; pointer-events: none; background: #e8eeff; opacity: 0; mix-blend-mode: soft-light; }

  /* 목업 전용 : 시간 · 날씨 확인용 조절기 */
  .ctl {
    position: fixed; left: 20px; bottom: 20px; z-index: 60; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: rgba(20, 16, 28, 0.78); font-size: 13px; max-width: calc(100vw - 40px);
  }
  .ctl input[type=range] { width: 160px; accent-color: #a855f7; }
  .ctl .clock { width: 42px; font-family: var(--font-point); color: #fff; }
  .ctl button { border: 1px solid var(--line); border-radius: 6px; background: #1a1a1a; color: #aaa; padding: 5px 9px; cursor: pointer; font-family: inherit; }
  .ctl button[aria-pressed='true'] { background: var(--fill); border-color: var(--fill); color: #fff; }
  body.ready .world { opacity: 1; transition: transform 0.9s var(--ease), opacity 1s var(--ease); }

  /* TV 화면 둘레 보랏빛 : 화면과 같은 계단 모양을 흐리게 번지게. 밤에 진하고 낮에는 거의 없다 */
  .tvaura {
    position: absolute; left: calc(546 / 1536 * 100%); top: calc(137 / 864 * 100%); width: calc(449 / 1536 * 100%); height: calc(307 / 864 * 100%);
    filter: blur(calc(var(--ww) * 0.012)); opacity: var(--aura, 0.6); pointer-events: none; transition: opacity 1s;
  }
  .tvaura::before { content: ''; position: absolute; inset: -4%; clip-path: var(--tvclip, none); background: #8b5cf6; }

  /* TV 에서 나오는 빛 : 화면 가운데에서 방 쪽으로 퍼지고, 바닥에는 앞으로 길게 떨어진다. 색은 화면 (보라 + 지금 CD 색) */
  .tvlight { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen; opacity: var(--tvl, 0.8); transition: opacity 1s; }
  .tvlight::before, .tvlight::after { content: ''; position: absolute; transition: background 0.8s; }
  .tvlight::before {
    left: calc(770 / 1536 * 100% - 60%); top: calc(290 / 864 * 100% - 55%); width: 120%; height: 110%;
    background: radial-gradient(closest-side, color-mix(in srgb, var(--lightc, #8b5cf6) 60%, transparent) 0%, color-mix(in srgb, var(--lightc, #8b5cf6) 22%, transparent) 45%, transparent 100%);
  }
  .tvlight::after {
    left: calc(770 / 1536 * 100% - 32%); top: calc(640 / 864 * 100%); width: 64%; height: 40%;
    background: radial-gradient(closest-side, color-mix(in srgb, var(--lightc, #8b5cf6) 45%, transparent) 0%, transparent 100%);
  }
  /* 화면 자체도 안쪽에서 빛나게 : 가운데가 조금 밝은 막 */
  .screenglow { position: absolute; inset: 0; z-index: 9; pointer-events: none; mix-blend-mode: screen; background: radial-gradient(ellipse at 50% 50%, color-mix(in srgb, var(--lightc, #8b5cf6) 28%, transparent), transparent 70%); }

  /* TV 화면 : 그림 속 보라색 화면 자리 (546, 137, 449 x 307) */
  .screen {
    position: absolute; left: calc(546 / 1536 * 100%); top: calc(137 / 864 * 100%); width: calc(449 / 1536 * 100%); height: calc(307 / 864 * 100%);
    clip-path: var(--tvclip, none); overflow: hidden; cursor: pointer;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at 50% 45%, #3a2a5a 0%, #1d1530 65%, #0f0b18 100%);
  }
  body.zoom .screen { cursor: default; }
  .glass {
    position: absolute; inset: 0; z-index: 10; pointer-events: none;
    background:
      repeating-linear-gradient(0deg, transparent 0 2px, rgba(0,0,0,0.16) 2px 3px),
      linear-gradient(150deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 22%, transparent 40%),
      radial-gradient(ellipse at 50% 50%, transparent 56%, rgba(0,0,0,0.6) 100%);
    box-shadow: inset 0 0 30px rgba(0,0,0,0.7);
  }
  .stage { position: absolute; inset: 0; perspective: 900px; perspective-origin: 50% 50%; touch-action: none; }
  body.zoom .stage { cursor: grab; }
  body.zoom .stage.drag { cursor: grabbing; }
  .cd {
    position: absolute; left: 50%; top: 50%; width: var(--d); height: var(--d);
    margin: calc(var(--d) / -2) 0 0 calc(var(--d) / -2);
    transform-style: preserve-3d; will-change: transform;
  }
  .disc {
    position: absolute; inset: 0; border-radius: 50%;
    background: linear-gradient(160deg, #a3a3ae 0%, #6c6c78 30%, #3a3a44 55%, #55555f 75%, #8a8a95 100%);
    -webkit-mask: radial-gradient(circle, transparent 0 6.4%, #000 6.8%);
            mask: radial-gradient(circle, transparent 0 6.4%, #000 6.8%);
    box-shadow: 0 10px 20px rgba(0,0,0,0.5);
  }
  .print {
    position: absolute; inset: 0.6%; border-radius: 50%;
    background: var(--art) center / cover; image-rendering: pixelated;
    -webkit-mask: radial-gradient(circle, transparent 0 21.6%, #000 22%);
            mask: radial-gradient(circle, transparent 0 21.6%, #000 22%);
    transform: rotate(var(--a, 0deg));
  }
  .hub {
    position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle,
      transparent 0 6.6%, rgba(255,255,255,0.07) 6.8% 11.6%, rgba(255,255,255,0.22) 11.8% 12.2%,
      rgba(255,255,255,0.05) 12.4% 15.5%, #8a8a95 15.7% 21.6%, rgba(255,255,255,0.35) 21.6% 22%, transparent 22.2%);
  }
  .disc::after { content: ''; position: absolute; inset: 0; border-radius: 50%; pointer-events: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.28); }
  .light { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 50%; mix-blend-mode: screen; pointer-events: none; }
  .spill { display: none; }

  /* 화면 안 좌우 화살표 : 확대했을 때만. 12 x 12 도트 버튼 */
  .arrow {
    position: absolute; top: 50%; z-index: 11; width: 9%; aspect-ratio: 1; margin-top: -4.5%; padding: 0;
    border: 0; background: none; cursor: pointer; image-rendering: pixelated;
    opacity: 0; pointer-events: none; transition: opacity 0.5s var(--ease), transform 0.2s steps(2);
  }
  body.zoom .arrow { opacity: 1; pointer-events: auto; transition-delay: 0.5s, 0s; }
  body.zoom .arrow:disabled { opacity: 0.3; cursor: default; }
  .arrow svg { width: 100%; height: 100%; display: block; }
  .arrow .ol { fill: #0e0a14; }
  .arrow .bg { fill: #2a1f42; transition: fill 0.2s steps(2); }
  .arrow .hi { fill: #3d2f5c; transition: fill 0.2s steps(2); }
  .arrow .ic { fill: #d9c8ff; }
  .arrow:not(:disabled):hover .bg { fill: #86198f; }
  .arrow:not(:disabled):hover .hi { fill: #a83ab3; }
  .arrow:not(:disabled):active { transform: translateY(6%); }
  .arrow.prev { left: 3%; }
  .arrow.next { right: 3%; }

  /* CD 이름 : 확대했을 때만, 가운데 CD 아래에 도트 글씨로 */
  .label {
    position: absolute; left: 0; top: 88%; width: 100%; height: auto; z-index: 9; pointer-events: none;
    image-rendering: pixelated; opacity: 0; transition: opacity 0.3s steps(3);
  }
  body.zoom .label.on { opacity: 1; transition-delay: 0.45s; }

  /* 도트 CD : 디스크 전체를 72 x 72 도트로 그린다 (실사 디스크 층은 숨긴다) */
  .dotcd { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; display: none; filter: drop-shadow(0 8px 12px rgba(0,0,0,0.5)); }
  body.dot .dotcd { display: block; }
  body.dot .disc { display: none; }

  /* 게임 페이지 (임시) : 디스크 자리에서 원으로 번진다 */
  .page {
    position: fixed; inset: 0; z-index: 30; pointer-events: none;
    background: var(--page);
    clip-path: circle(var(--pr) at var(--px) var(--py));
    visibility: hidden;
  }
  .page.anim { transition: clip-path 0.75s var(--ease); }
  .page .inner { padding: 110px 8vw 0; opacity: 0; transition: opacity 0.5s var(--ease); }
  .page.shown .inner { opacity: 1; }
  .page h1 { margin: 0 0 36px; font-family: var(--font-point); font-size: clamp(32px, 5vw, 60px); color: #fff; }
  .page .blocks { display: grid; grid-template-columns: 2fr 1fr; gap: 18px; max-width: 760px; }
  .page .blk { height: 220px; border-radius: 6px; background: rgba(255,255,255,0.08); }
  .page .blk.s { height: 100px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.15s !important; }
  }
</style>
</head>
<body class="dot">
  <a class="icon-btn home" href="#" aria-label="홈으로">⌂</a>
  <button class="icon-btn back" aria-label="돌아가기"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></svg></button>

  <div class="world" id="world">
    <div class="bg"></div>
    <canvas class="win" id="win" width="247" height="360"></canvas>
    <canvas class="patch" id="patch" width="400" height="105"></canvas>
    <canvas class="tailcv" id="tailcover" width="58" height="34"></canvas>
    <canvas class="tailcv pix" id="tailpix" width="58" height="34"></canvas>
    <canvas class="padcv" id="pad" width="96" height="72"></canvas>
    <div class="tint"></div>
    <div class="flash" id="flash"></div>
    <div class="tvlight"></div>
    <div class="tvaura"></div>
    <div class="screen" id="screen" tabindex="0" aria-label="TV">
      <div class="stage" id="stage"></div>
      <button class="arrow prev" id="prev" aria-label="이전 CD"><svg viewBox="0 0 12 12" shape-rendering="crispEdges"><path class="ol" d="M2 0h8v1h1v1h1v8h-1v1h-1v1H2v-1H1v-1H0V2h1V1h1z"/><path class="bg" d="M2 1h8v1h1v8h-1v1H2v-1H1V2h1z"/><path class="hi" d="M2 1h8v1H2zM1 2h1v3H1z"/><g class="ic"><rect x="6" y="3" width="1" height="1"/><rect x="5" y="4" width="1" height="1"/><rect x="4" y="5" width="1" height="1"/><rect x="3" y="6" width="1" height="1"/><rect x="4" y="7" width="1" height="1"/><rect x="5" y="8" width="1" height="1"/><rect x="6" y="9" width="1" height="1"/><rect x="7" y="3" width="1" height="1"/><rect x="6" y="4" width="1" height="1"/><rect x="5" y="5" width="1" height="1"/><rect x="4" y="6" width="1" height="1"/><rect x="5" y="7" width="1" height="1"/><rect x="6" y="8" width="1" height="1"/><rect x="7" y="9" width="1" height="1"/></g></svg></button>
      <button class="arrow next" id="next" aria-label="다음 CD"><svg viewBox="0 0 12 12" shape-rendering="crispEdges"><path class="ol" d="M2 0h8v1h1v1h1v8h-1v1h-1v1H2v-1H1v-1H0V2h1V1h1z"/><path class="bg" d="M2 1h8v1h1v8h-1v1H2v-1H1V2h1z"/><path class="hi" d="M2 1h8v1H2zM1 2h1v3H1z"/><g class="ic"><rect x="5" y="3" width="1" height="1"/><rect x="6" y="4" width="1" height="1"/><rect x="7" y="5" width="1" height="1"/><rect x="8" y="6" width="1" height="1"/><rect x="7" y="7" width="1" height="1"/><rect x="6" y="8" width="1" height="1"/><rect x="5" y="9" width="1" height="1"/><rect x="4" y="3" width="1" height="1"/><rect x="5" y="4" width="1" height="1"/><rect x="6" y="5" width="1" height="1"/><rect x="7" y="6" width="1" height="1"/><rect x="6" y="7" width="1" height="1"/><rect x="5" y="8" width="1" height="1"/><rect x="4" y="9" width="1" height="1"/></g></svg></button>
      <canvas class="label" id="label" width="200" height="10"></canvas>
      <div class="screenglow"></div>
      <div class="glass"></div>
    </div>
  </div>
  <div class="ctl" id="ctl">
    <input type="range" id="hour" min="0" max="24" step="0.25" aria-label="시각" />
    <span class="clock" id="clock"></span>
    <button data-t="now" aria-pressed="true">지금</button>
    <span>·</span>
    <span>달</span>
    <input type="range" id="phase" min="0" max="1" step="0.01" aria-label="달 모양" style="width: 90px" />
    <span>·</span>
    <button data-w="real" aria-pressed="true">실제 날씨</button>
    <button data-w="clear" aria-pressed="false">맑음</button>
    <button data-w="cloudy" aria-pressed="false">흐림</button>
    <button data-w="rain" aria-pressed="false">비</button>
    <button data-w="snow" aria-pressed="false">눈</button>
  </div>
  <div class="page" id="page"><div class="inner"><h1 id="pageTitle"></h1><div class="blocks"><div class="blk"></div><div class="blk"></div><div class="blk s"></div><div class="blk s"></div></div></div></div>

<script>
// ───────── 도트 그리기 도구 ─────────
const Bayer = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]]
const pen = (ctx) => {
  const px = (c, x, y) => { ctx.fillStyle = c; ctx.fillRect(x, y, 1, 1) }
  const rect = (c, x, y, w, h) => { ctx.fillStyle = c; ctx.fillRect(x, y, w, h) }
  const circ = (c, cx, cy, r) => { for (let y = Math.floor(cy - r); y <= cy + r; y++) for (let x = Math.floor(cx - r); x <= cx + r; x++) if ((x + 0.5 - cx) ** 2 + (y + 0.5 - cy) ** 2 <= r * r) px(c, x, y) }
  // 세로 그라데이션을 4 x 4 디더링으로
  const vgrad = (x0, y0, w, h, Stops) => {
    for (let y = y0; y < y0 + h; y++) {
      const T = ((y - y0) / Math.max(1, h - 1)) * (Stops.length - 1)
      const I = Math.min(Stops.length - 2, Math.floor(T)), F = T - I
      for (let x = x0; x < x0 + w; x++) px(F * 16 > Bayer[y & 3][x & 3] ? Stops[I + 1] : Stops[I], x, y)
    }
  }
  return { px, rect, circ, vgrad }
}
const rnd = (seed) => { let X = seed; return () => ((X = (X * 9301 + 49297) % 233280) / 233280) }

// ───────── CD 인쇄면 : 64 x 64 도트 키 아트 (임시) ─────────
const ArtData = new Map()
const art = (draw) => { const Cv = document.createElement('canvas'); Cv.width = Cv.height = 64; const X = Cv.getContext('2d'); draw(pen(X), rnd(7)); const U = `url(${Cv.toDataURL()})`; ArtData.set(U, X.getImageData(0, 0, 64, 64).data); return U }
const Arts = {
  exorcism: art(({ px, rect, circ, vgrad }, R) => {
    vgrad(0, 0, 64, 64, ['#120818', '#2a0c22', '#5a1426'])
    for (let i = 0; i < 22; i++) px('#e8d8c8', (R() * 64) | 0, (R() * 34) | 0)
    circ('#c8283a', 45, 17, 9); circ('#e04a52', 43.5, 15.5, 6.5); px('#a01e2e', 46, 19); px('#a01e2e', 42, 14); px('#a01e2e', 48, 14)
    rect('#efe0b0', 9, 8, 7, 19); rect('#b3182a', 12, 10, 1, 6); rect('#b3182a', 10, 17, 5, 1); rect('#b3182a', 12, 19, 1, 6); px('#b3182a', 11, 23); px('#b3182a', 13, 22)
    rect('#0a0510', 0, 52, 64, 12)
    for (let y = 30; y < 40; y++) { const Hw = (y - 30) * 2.6 + 4; rect('#0a0510', 32 - Hw, y, Hw * 2, 1) }
    rect('#0a0510', 13, 40, 38, 12)
    for (let x = 17; x < 48; x += 4) { px(x % 8 ? '#f2c66d' : '#3a2020', x, 43); px(x % 12 ? '#3a2020' : '#f2c66d', x, 47) }
    rect('#f2c66d', 30, 48, 3, 4)
  }),
  factory: art(({ px, rect, circ, vgrad }, R) => {
    vgrad(0, 0, 64, 64, ['#ffd27a', '#f39a33', '#b4481a', '#5a1f0c'])
    circ('#fff0b8', 34, 27, 8)
    ;[[20, 11, 3], [23, 7, 4], [27, 4, 3], [45, 14, 3], [48, 9, 4]].forEach(([x, y, r]) => circ('#e9d4c0', x, y, r))
    rect('#2a1208', 18, 14, 4, 24); rect('#2a1208', 44, 18, 4, 20)
    rect('#2a1208', 8, 38, 48, 14)
    for (let i = 0; i < 6; i++) for (let k = 0; k < 4; k++) rect('#2a1208', 8 + i * 8, 34 + k, 8 - k * 2, 1)
    for (let x = 12; x < 54; x += 5) px('#ffb347', x, 43)
    rect('#3a2a22', 0, 53, 64, 4)
    for (let x = 1; x < 64; x += 4) px('#7a5a48', x, 55)
    ;[6, 22, 38, 54].forEach((x) => { rect('#c98a4a', x, 49, 5, 4); px('#e0a868', x, 49) })
    rect('#1a0c06', 0, 57, 64, 7)
  }),
  mmo: art(({ px, rect, circ, vgrad }, R) => {
    vgrad(0, 0, 64, 64, ['#070b2a', '#141f66', '#2c3fa6'])
    for (let i = 0; i < 40; i++) px(R() > 0.7 ? '#bfe7ff' : '#ffffff', (R() * 64) | 0, (R() * 40) | 0)
    circ('#f4f1ff', 48, 14, 6); circ('#0b1240', 50.5, 12, 5)
    for (let x = 0; x < 64; x++) { const Y = Math.round(47 - 6 * Math.sin((x / 64) * Math.PI)); rect('#0b1030', x, Y, 1, 64 - Y) }
    // 성 : 가운데 허브에 가리지 않게 오른쪽 아래 언덕 위에
    rect('#0e1438', 40, 38, 16, 10); rect('#0e1438', 38, 32, 4, 16); rect('#0e1438', 54, 32, 4, 16); rect('#0e1438', 45, 28, 6, 10)
    ;[[39, 31], [55, 31], [46, 27], [49, 27]].forEach(([x, y]) => px('#0e1438', x, y))

// 게임 목록 (임시)
const Games = [
  { en: 'Exorcism School', c: '#c8283a', art: Arts.exorcism },
  { en: 'Factory', c: '#f39a33', art: Arts.factory },
  { en: 'Fake MMO', c: '#4361ee', art: Arts.mmo },
  { en: 'Cheer Typing', c: '#ec4899', art: Arts.cheer },
]
const N = Games.length
// ───────── 반사광 셰이더 : 화면 왼쪽 위에 고정된 점광원 ─────────
// 데이터면 : 동심원 홈 (간격 1.6µm) 이 회절 격자라, 빛 · 눈 · 중심이 한 줄에 놓이는 자리에 무지갯빛 줄이 생긴다
// 인쇄면 : 빛 반응 없음 (마우스를 따라오는 하얀 광은 쓰지 않는다)
const VS = 'attribute vec2 a; varying vec2 p; void main(){ p = a; gl_Position = vec4(a, 0., 1.); }'
const FS = `precision highp float;
varying vec2 p;
uniform vec3 uL;
uniform vec3 uV;
uniform float uBlank;
uniform float uPx;
vec3 wave(float l) {
  vec3 c = vec3(0.);
  if (l >= 380. && l < 440.) c = vec3(-(l - 440.) / 60., 0., 1.);
  else if (l >= 440. && l < 490.) c = vec3(0., (l - 440.) / 50., 1.);
  else if (l >= 490. && l < 510.) c = vec3(0., 1., -(l - 510.) / 20.);
  else if (l >= 510. && l < 580.) c = vec3((l - 510.) / 70., 1., 0.);
  else if (l >= 580. && l < 645.) c = vec3(1., -(l - 645.) / 65., 0.);
  else if (l >= 645. && l <= 750.) c = vec3(1., 0., 0.);
  float f = 0.;
  if (l >= 380. && l < 420.) f = 0.3 + 0.7 * (l - 380.) / 40.;
  else if (l >= 420. && l < 700.) f = 1.;
  else if (l >= 700. && l <= 750.) f = 0.3 + 0.7 * (750. - l) / 50.;
  return c * f;
}
float band(float r, float a, float b) { return smoothstep(a - uPx, a + uPx, r) * (1. - smoothstep(b - uPx, b + uPx, r)); }
void main() {
  vec2 q = vec2(p.x, -p.y);
  float r = length(q);
  if (r > 1.) { gl_FragColor = vec4(0.); return; }
  vec3 P = vec3(q, 0.);
  vec3 L = normalize(uL - P);
  vec3 V = normalize(uV - P);
  vec3 H = L + V;
  vec2 rd = r > 1e-4 ? q / r : vec2(1., 0.);
  vec2 td = vec2(-rd.y, rd.x);
  float ut = dot(td, H.xy), ur = dot(rd, H.xy);
  // 홈 방향 (접선) 으로는 거울처럼 반사 : 접선 성분이 0 인 곳에만 빛이 맺혀 줄이 된다
  float streak = exp(-pow(ut / H.z * 11., 2.));
  vec3 diff = vec3(0.);
  for (int n = 1; n <= 4; n++) diff += wave(1600. * abs(ur) / float(n)) * (1.15 - 0.2 * float(n));
  diff = diff * streak * 0.85 + vec3(1.) * streak * exp(-ur * ur * 300.) * 0.9;
  float nh = normalize(H).z;
  float gloss = 0.;
  float clear = band(r, 0.068, 0.155);
  float mirror = band(r, 0.157, 0.218);
  float face = band(r, 0.22, 0.994);
  float rim = band(r, 0.994, 1.0);
  float wD = mirror + face * uBlank + rim * 0.5;
  float wG = clear * 0.6 + mirror + face + rim;
  vec3 c = diff * wD + vec3(gloss) * wG;
  gl_FragColor = vec4(c, 1.);
}`
const mkLight = (host, blank) => {
  const Cv = document.createElement('canvas')
  Cv.className = 'light'
  Cv.width = Cv.height = 640
  host.append(Cv)
  const Gl = Cv.getContext('webgl', { premultipliedAlpha: false, alpha: true })
  if (!Gl) return null
  const sh = (t, src) => { const S = Gl.createShader(t); Gl.shaderSource(S, src); Gl.compileShader(S); return S }
  const Pr = Gl.createProgram()
  Gl.attachShader(Pr, sh(Gl.VERTEX_SHADER, VS)); Gl.attachShader(Pr, sh(Gl.FRAGMENT_SHADER, FS)); Gl.linkProgram(Pr); Gl.useProgram(Pr)
  Gl.bindBuffer(Gl.ARRAY_BUFFER, Gl.createBuffer())
  Gl.bufferData(Gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), Gl.STATIC_DRAW)
  const A = Gl.getAttribLocation(Pr, 'a'); Gl.enableVertexAttribArray(A); Gl.vertexAttribPointer(A, 2, Gl.FLOAT, false, 0, 0)
  const U = { L: Gl.getUniformLocation(Pr, 'uL'), V: Gl.getUniformLocation(Pr, 'uV'), B: Gl.getUniformLocation(Pr, 'uBlank'), Px: Gl.getUniformLocation(Pr, 'uPx') }
  Gl.uniform1f(U.B, blank ? 1 : 0)
  Gl.uniform1f(U.Px, 1.5 / 320)
  return (Lx, Ly, Vx, Vy) => {
    Gl.uniform3f(U.L, Lx, Ly, 1.7)
    Gl.uniform3f(U.V, Vx, Vy, 5.5)
    Gl.drawArrays(Gl.TRIANGLE_STRIP, 0, 4)
  }
}


let Pos = 0, Target = 0, Index = 0
let Open = -1
let Hover = false

const Stage = document.getElementById('stage')
// 빛은 마우스를 따라가지 않고 TV 왼쪽 위 (창문 쪽) 한 자리에 고정
let Zs = 1
const Scr = () => document.getElementById('screen').getBoundingClientRect()
const lightAt = () => { const R = Scr(); return [R.left + R.width * 0.12, R.top - R.height * 0.35] }
const Cds = Games.map((g, i) => {
  const El = document.createElement('div')
  El.className = 'cd'
  El.innerHTML = `<div class="disc">${g.art ? `<div class="print" style="--art:${g.art}"></div>` : ''}<div class="hub"></div><div class="spill"></div></div><canvas class="dotcd" width="72" height="72"></canvas>`
  El.addEventListener('pointerenter', () => { if (i === Index) Hover = true })
  El.addEventListener('pointerleave', () => { Hover = false })
  Stage.append(El)
  const Dc = El.querySelector('.dotcd')
  return { el: El, print: El.querySelector('.print'), a: Math.random() * 360, v: 0, light: mkLight(El.querySelector('.disc'), !g.art), key: '', dot: Dc.getContext('2d'), img: Dc.getContext('2d').createImageData(72, 72), art: g.art ? ArtData.get(g.art) : null }
})
const Dsize = () => Cds[0].el.offsetWidth
const go = (i) => { Target = Math.max(0, Math.min(N - 1, i)) }
const setSpill = () => document.documentElement.style.setProperty('--spill', Games[Open >= 0 ? Open : Index].c)

// 드래그 : 손을 따라 디스크가 굴러가고, 놓으면 가장 가까운 디스크에 멈춘다
let Drag = null, Moved = false, Vel = 0
Stage.addEventListener('pointerdown', (e) => {
  if (Open >= 0) return
  Drag = { x: e.clientX, last: e.clientX, start: Pos, t: performance.now() }
  Moved = false; Vel = 0
  Stage.classList.add('drag')
  Stage.setPointerCapture(e.pointerId)
})
Stage.addEventListener('pointermove', (e) => {
  if (!Drag) return
  const Sp = Dsize() * 0.72 * Zs, Dx = e.clientX - Drag.x
  if (Math.abs(Dx) > 5) Moved = true
  const Now = performance.now()
  Vel = ((e.clientX - Drag.last) / Math.max(1, Now - Drag.t)) * 16 / Sp
  Drag.last = e.clientX; Drag.t = Now
  Pos = Math.max(-0.35, Math.min(N - 0.65, Drag.start - Dx / Sp))
  Target = Pos
})
Stage.addEventListener('pointerup', (e) => {
  if (!Drag) return
  Stage.classList.remove('drag')
  Drag = null
  if (Moved) { go(Math.round(Pos - Vel * 6)); return }
  const Hit = Cds.findIndex((c) => c.el.contains(document.elementFromPoint(e.clientX, e.clientY)))
  if (Hit < 0) return
  if (Hit === Index && Math.abs(Pos - Index) < 0.05) openPage(Hit)
  else go(Hit)
})
let WheelLock = 0
Stage.addEventListener('wheel', (e) => {
  const Now = performance.now(), Dl = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY
  if (Open >= 0 || Now - WheelLock < 180 || Math.abs(Dl) < 6) return
  WheelLock = Now
  go(Math.round(Target) + Math.sign(Dl))
}, { passive: true })
addEventListener('keydown', (e) => {
  if (Open >= 0) { if (e.key === 'Escape') closePage(); return }
  if (e.key === 'Escape') zoom(false)
  if (e.key === 'ArrowRight') go(Math.round(Target) + 1)
  if (e.key === 'ArrowLeft') go(Math.round(Target) - 1)
  if (e.key === 'Enter') openPage(Index)
})

document.getElementById('prev').onclick = () => go(Math.round(Target) - 1)
document.getElementById('next').onclick = () => go(Math.round(Target) + 1)
const syncArrows = () => { document.getElementById('prev').disabled = Math.round(Target) <= 0; document.getElementById('next').disabled = Math.round(Target) >= N - 1 }

// 도트 CD : 인쇄면은 64 x 64 키 아트를 돌려서 가장 가까운 칸으로 옮기고, 빛은 고정된 방향의 무지갯빛 줄
const hex = (h) => [1, 3, 5].map((q) => parseInt(h.slice(q, q + 2), 16))
const Rainbow = ['#ff5a5a', '#ffb84d', '#ffe66d', '#6dff9a', '#5ac8ff', '#8a7dff', '#d06dff'].map(hex)
// 디스크 모양 칸표 : 0 바깥, 1 어두운 외곽선, 2 밝은 테두리, 3 안쪽. 원을 도트로 찍을 때 어느 방향이든 1 칸 두께가 되도록 이웃 칸으로 판정한다
const DotMask = (() => {
  const Sz = 72, Hf = Sz / 2, In = (x, y) => x >= 0 && y >= 0 && x < Sz && y < Sz && Math.hypot((x + 0.5 - Hf) / Hf, (y + 0.5 - Hf) / Hf) <= 0.955
  const M = new Uint8Array(Sz * Sz)
  const Edge = (x, y) => !In(x + 1, y) || !In(x - 1, y) || !In(x, y + 1) || !In(x, y - 1)
  for (let y = 0; y < Sz; y++) for (let x = 0; x < Sz; x++) {
    if (In(x, y)) M[y * Sz + x] = Edge(x, y) ? 2 : 3
    else if (In(x + 1, y) || In(x - 1, y) || In(x, y + 1) || In(x, y - 1)) M[y * Sz + x] = 1
  }
  return M
})()
const drawDot = (c, i) => {
  const D = c.img.data, Sz = 72, Hf = Sz / 2
  const A = (c.a * Math.PI) / 180, Ca = Math.cos(-A), Sa = Math.sin(-A)
  const B = c.el.getBoundingClientRect(), R = B.width / 2
  const [Lx0, Ly0] = lightAt()
  const La = Math.atan2(Ly0 - (B.top + R), Lx0 - (B.left + R))
  for (let y = 0; y < Sz; y++) for (let x = 0; x < Sz; x++) {
    const K = (y * Sz + x) * 4
    const Px = (x + 0.5 - Hf) / Hf, Py = (y + 0.5 - Hf) / Hf, Rr = Math.hypot(Px, Py)
    let Col = null
    const Mk = DotMask[y * Sz + x]
    if (!Mk || Rr < 0.075) { D[K + 3] = 0; continue }
    const Bay = Bayer[y & 3][x & 3] / 16
    // 빛 쪽 · 반대쪽 줄 : 각도 차이가 작을수록 진하다
    let Dt = Math.abs(((Math.atan2(Py, Px) - La + Math.PI * 3) % (Math.PI * 2)) - Math.PI)
    Dt = Math.min(Dt, Math.PI - Dt)
    const Streak = Math.max(0, 1 - Dt / 0.16)
    const Spec = Rainbow[Math.min(6, Math.floor(Rr * 7.5) % 7)]
    if (Mk === 1) Col = [30, 22, 40]
    else if (Rr < 0.16) Col = Rr < 0.12 ? [150, 150, 165] : [205, 205, 218]
    else if (Rr < 0.22 || !c.art) {
      const G = 150 + 60 * Math.cos(Math.atan2(Py, Px) * 2 - La * 2)
      Col = [G * 0.9, G * 0.9, G]
      if (Streak > Bay) Col = Spec
    } else {
      const Ux = Px * Ca - Py * Sa, Uy = Px * Sa + Py * Ca
      const Ax = Math.min(63, Math.max(0, Math.floor((Ux * 0.994 + 1) * 32))), Ay = Math.min(63, Math.max(0, Math.floor((Uy * 0.994 + 1) * 32)))
      const Q = (Ay * 64 + Ax) * 4
      Col = [c.art[Q], c.art[Q + 1], c.art[Q + 2]]
    }
    if (Mk === 2) Col = [215, 215, 228]
    D[K] = Col[0]; D[K + 1] = Col[1]; D[K + 2] = Col[2]; D[K + 3] = 255
  }
  c.dot.putImageData(c.img, 0, 0)
}

const MaxV = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0.375 : 2.4375
const place = () => {
  const Prev = Pos
  if (!Drag) Pos += (Target - Pos) * 0.12
  const Sz = Dsize(), Sp = Sz * 0.72
  const Roll = (Pos - Prev) * Sp * -0.5
  const Ni = Math.max(0, Math.min(N - 1, Math.round(Pos)))
  if (Ni !== Index) { Index = Ni; Hover = false; setSpill() }
  syncArrows()
  const [Lx0, Ly0] = lightAt()
  const Sr = Scr(), Cs = [Sr.left + Sr.width / 2, Sr.top + Sr.height / 2]
  Cds.forEach((c, i) => {
    const d = i - Pos, Ad = Math.abs(d)
    const Sc = 1 - 0.4 * Math.min(Ad, 1) - 0.1 * Math.max(0, Math.min(Ad - 1, 2))
    const Ry = Math.max(-38, Math.min(38, -d * 30))
    const X = Math.sign(d) * (Math.min(Ad, 1) * Sp + Math.max(0, Ad - 1) * Sp * 0.55)
    c.el.style.transform = `translateX(${X}px) rotateY(${Ry}deg) scale(${Sc})`
    c.el.style.opacity = Math.max(0, 1 - 0.28 * Math.max(0, Ad - 0.4))
    c.el.style.zIndex = 100 - Math.round(Ad * 10)
    const On = Hover && i === Index && !Drag
    c.v += ((On ? MaxV : 0) - c.v) * (On ? 0.035 : 0.025)
    c.a += c.v + Roll
    if (c.print) c.print.style.setProperty('--a', c.a + 'deg')
    if (document.body.classList.contains('dot') && Ad < 2.5) drawDot(c, i)
    if (!c.light || Ad > 2.5 || document.body.classList.contains('dot')) return
    const B = c.el.getBoundingClientRect(), R = B.width / 2, Cx = B.left + R, Cy = B.top + R
    const V = [(Lx0 - Cx) / R, (Ly0 - Cy) / R, (Cs[0] - Cx) / R, (Cs[1] - Cy) / R]
    const Key = V.map((v) => v.toFixed(3)).join()
    if (Key !== c.key) { c.key = Key; c.light(...V) }
  })
}

// 게임 페이지 열고 닫기 : 디스크 자리에서 원으로 번지고, 디스크 자리로 줄어든다
const Page = document.getElementById('page')
const discCircle = (i) => {
  const R = Cds[i].el.getBoundingClientRect()
  return { px: R.left + R.width / 2 + 'px', py: R.top + R.height / 2 + 'px', pr: R.width / 2 + 'px' }
}
const setCircle = (o) => Object.entries(o).forEach(([k, v]) => Page.style.setProperty('--' + k, v))
const openPage = (i) => {
  if (!Games[i].en) return
  Open = i
  setSpill()
  Page.style.setProperty('--page', `linear-gradient(160deg, ${Games[i].c}, #140f18 70%)`)
  document.getElementById('pageTitle').textContent = Games[i].en
  Page.classList.remove('anim', 'shown')
  setCircle(discCircle(i))
  Page.style.visibility = 'visible'
  Page.style.pointerEvents = 'auto'
  requestAnimationFrame(() => requestAnimationFrame(() => {
    Page.classList.add('anim')
    setCircle({ pr: Math.hypot(innerWidth, innerHeight) + 'px' })
    document.body.classList.add('open')
  }))
  setTimeout(() => Page.classList.add('shown'), 700)
}
const closePage = () => {
  if (Open < 0) return
  Page.classList.remove('shown')
  document.body.classList.remove('open')
  setTimeout(() => {
    setCircle(discCircle(Open))
    setTimeout(() => { Page.style.visibility = 'hidden'; Page.style.pointerEvents = 'none'; Open = -1; setSpill() }, 760)
  }, 260)
}

const layoutWorld = () => {
  const W = innerWidth, H = innerHeight
  const K = Math.max(W / Iw, H / Ih)
  const Tc = (Tvr.x + Tvr.w / 2) * K
  const Ox = Math.min(0, Math.max(W - Iw * K, W / 2 - Tc))
  const Oy = (H - Ih * K) / 2
  Base = { k: K, ox: Ox, oy: Oy }
  const Rs = document.documentElement.style
  Rs.setProperty('--ww', Iw * K + 'px'); Rs.setProperty('--wh', Ih * K + 'px')

}
// 확대 : TV 쪽으로 다가가되 주변 방이 조금 보이도록 세계 전체를 키우고 옮긴다
const apply = () => {
  const W = innerWidth, H = innerHeight
  let S = 1, Tx = Base.ox, Ty = Base.oy
  if (Zoomed) {
    const Sw = Tvr.w * Base.k, Sh = Tvr.h * Base.k
    // 좁은 화면에서는 이미 TV 가 화면을 채우므로 줄이지 않는다
    // TV 화면이 창의 60% 정도만 차지해서 TV 몸체와 주변 방이 살짝 보이게
    S = Math.max(1, Math.min((W * 0.62) / Sw, (H * 0.64) / Sh))
    Tx = W / 2 - (Tvr.x + Tvr.w / 2) * Base.k * S
    Ty = H / 2 - (Tvr.y + Tvr.h / 2) * Base.k * S
    // 그림 밖 (검은 바탕) 이 드러나지 않게
    Tx = Math.min(0, Math.max(W - Iw * Base.k * S, Tx))
    Ty = Math.min(0, Math.max(H - Ih * Base.k * S, Ty))
  }
  Zs = S
  World.style.transform = `translate(${Tx}px, ${Ty}px) scale(${S})`
  document.body.classList.toggle('zoom', Zoomed)
}

const drawView = (t, S) => {
  const Wt = Weather, Gray = Wt === 'clear' ? 0 : Wt === 'cloudy' ? 0.45 : 0.6
  const Top = lerpc(S.top, '#5a6070', Gray * (1 - S.night * 0.7)), Bot = lerpc(S.bot, '#8a90a0', Gray * (1 - S.night * 0.7))
  Vp.vgrad(0, 0, 62, 90, [Top, lerpc(Top, Bot, 0.5), Bot])
  // 별 : 밤이고 맑을 때
  const StarA = S.night * (Wt === 'clear' ? 1 : 0.15)
  Stars.forEach(([x, y, a]) => { if (StarA * (0.5 + 0.5 * Math.sin(t / 700 + a * 9)) > a * 0.8) Vp.px('#e6e2ff', x, y) })
  // 해 · 달 : 창을 가로지르는 호
  // 해 · 달 : 가운데는 밝게, 가장자리는 한 톤 낮게, 둘레는 하늘색에서 빛 색으로 두 단계 섞인 고리 (체크무늬 없이)
  const SkyAt = (y) => lerpc(Top, Bot, Math.min(1, Math.max(0, y / 89)))
  const Body = (frac, r, core, edge, halo) => {
    const X = lerp(6, 56, frac), Y = 58 - Math.sin(frac * Math.PI) * 46
    for (let yy = Math.floor(Y - r - 4); yy <= Y + r + 4; yy++) for (let xx = Math.floor(X - r - 4); xx <= X + r + 4; xx++) {
      const D = Math.hypot(xx + 0.5 - X, yy + 0.5 - Y)
      if (D <= r - 1.2) Vp.px(core, xx, yy)
      else if (D <= r) Vp.px(edge, xx, yy)
      else if (halo && D <= r + 1.6) Vp.px(lerpc(SkyAt(yy), halo, 0.5), xx, yy)
      else if (halo && D <= r + 3.6) Vp.px(lerpc(SkyAt(yy), halo, 0.22), xx, yy)
    }
    return [X, Y]
  }
  const Hidden = Wt === 'clear' ? 0 : Wt === 'cloudy' ? 0.5 : 1
  if (Hidden < 1) {
    if (Hour >= 6 && Hour <= 19) Body((Hour - 6) / 13, 4, '#fffbe8', '#ffe9a6', Hour > 17 || Hour < 7.5 ? '#ffc890' : '#fff4d0')
    else {
      // 달 : 해보다 조금 큰 정도로, 오늘의 위상만큼만 밝게 (안 보이는 쪽은 하늘에 살짝 비치는 어두운 면)
      const F = ((Hour + 24 - 19) % 24) / 11, X = lerp(6, 56, F), Y = 58 - Math.sin(F * Math.PI) * 46, R = 5
      const Lit = 0.5 - 0.5 * Math.cos(2 * Math.PI * MoonPhase)
      for (let yy = Math.floor(Y - R - 4); yy <= Y + R + 4; yy++) for (let xx = Math.floor(X - R - 4); xx <= X + R + 4; xx++) {
        const Dx = xx + 0.5 - X, Dy = yy + 0.5 - Y, D = Math.hypot(Dx, Dy)
        if (D <= R) {
          const V = Dy / R, U = Dx / R, W = Math.sqrt(Math.max(0, 1 - V * V))
          // 차는 달 (위상 0 ~ 0.5) 은 오른쪽부터, 기우는 달 (0.5 ~ 1) 은 왼쪽만 남는다
          const On = MoonPhase < 0.5 ? U > W * Math.cos(2 * Math.PI * MoonPhase) : U < W * Math.cos(2 * Math.PI * (MoonPhase - 0.5))
          const Crater = (Math.abs(Dx - 1.5) < 1 && Math.abs(Dy - 1.2) < 1) || (Math.abs(Dx + 2) < 0.8 && Math.abs(Dy + 1.5) < 0.8)
          Vp.px(On ? (Crater ? '#e2d8b8' : D > R - 1 ? '#e8e0c4' : '#f4efd8') : lerpc(SkyAt(yy), '#3a3a58', 0.55), xx, yy)
        } else if (D <= R + 1.6) Vp.px(lerpc(SkyAt(yy), '#9a9ac8', 0.5 * Lit), xx, yy)
        else if (D <= R + 3.6) Vp.px(lerpc(SkyAt(yy), '#9a9ac8', 0.22 * Lit), xx, yy)
      }
    }
  }
  // 구름
  if (Wt !== 'clear') Clouds.forEach(([x0, y, r], i) => {
    const X = ((x0 + t / (900 + i * 300)) % 84) - 12, C = lerpc(lerpc(Top, '#ffffff', 0.35), '#2a2a3a', S.night * 0.7)
    Vp.circ(C, X, y, r); Vp.circ(C, X + r * 0.9, y + 1, r * 0.8); Vp.circ(C, X - r * 0.9, y + 1, r * 0.7)
  })
  // 먼 나무 · 집 : 하늘 아래쪽보다 어둡게, 밤에는 창에 불이 켜진다
  const Sil = lerpc(Bot, '#05060f', 0.55 + S.night * 0.3), Sil2 = lerpc(Bot, '#05060f', 0.7 + S.night * 0.25)
  Pines.forEach(([x, y]) => { for (let k = 0; y + k < 90; k++) { const w = Math.min(4, Math.floor(k / 2)); Vp.rect(Sil, x - w, y + k, w * 2 + 1, 1) } })
  Houses.forEach(([x, y, w, h]) => {
    Vp.rect(Sil2, x, y, w, 90 - y)
    for (let k = 0; k < Math.ceil(w / 2); k++) Vp.rect(Sil2, x + k, y - k, w - k * 2, 1)
    if (S.night > 0.35) { Vp.rect('#ffd27a', x + 2, y + 3, 2, 2); Vp.rect('#ffd27a', x + w - 4, y + 3, 2, 2) }
  })
  if (Wt === 'snow') Vp.rect(lerpc('#e8eef8', '#7a80a0', S.night * 0.6), 0, 86, 62, 4)
  // 비 · 눈
  if (Wt === 'rain') {
    const C = lerpc(Bot, '#ffffff', 0.45)
    Beads.forEach((b) => { b[1] = (b[1] + b[2]) % 90; Vp.px('#c8d4f0', b[0], b[1] | 0) })
  }
  if (Wt === 'snow') Drops.forEach((d, i) => { d[1] = (d[1] + d[2] * 0.35) % 92; const X = (d[0] + Math.sin(t / 900 + i) * 1.5 + 62) % 62; Vp.px('#f4f6ff', X | 0, d[1] | 0) })
}

const Root = document.documentElement.style
const Flash = document.getElementById('flash')
let NextBolt = 0
const drawSky = (t) => {
  const S = atHour(Hour)
  // 날씨가 방에도 : 비 · 흐림은 어둡고 푸르게, 눈은 조금 밝고 차갑게
  const Wb = Weather === 'rain' ? 0.8 : Weather === 'cloudy' ? 0.9 : Weather === 'snow' ? 1.05 : 1
  Root.setProperty('--roomf', `brightness(${(S.br * Wb).toFixed(3)}) saturate(${(S.sa * (Weather === 'clear' ? 1 : 0.8)).toFixed(3)}) sepia(${S.se.toFixed(3)}) hue-rotate(${S.hr.toFixed(1)}deg)`)
  Root.setProperty('--tint', Weather === 'rain' ? '#6a80b0' : Weather === 'snow' ? '#dfe8ff' : S.tint)
  Root.setProperty('--tinta', (Weather === 'clear' ? S.ta : Math.max(S.ta * 0.5, 0.3)).toFixed(3))
  Root.setProperty('--aura', (0.05 + 0.42 * S.night).toFixed(3))
  // 방으로 퍼지는 TV 빛 : 밤에 진하고 낮에는 거의 없다. 색은 보라에 지금 CD 색을 섞고, 아주 미세하게 깜빡인다
  const Flick = 1 + Math.sin(t / 90) * 0.02 + Math.sin(t / 37) * 0.015
  Root.setProperty('--tvl', ((0.04 + 0.7 * S.night) * Flick).toFixed(3))
  Root.setProperty('--lightc', lerpc('#8b5cf6', Games[Open >= 0 ? Open : Index].c, 0.35))
  if (!MaskReady) return
  drawView(t, S)
  Wctx.globalCompositeOperation = 'source-over'
  Wctx.clearRect(0, 0, 247, 360); Wctx.imageSmoothingEnabled = false
  Wctx.drawImage(View, 0, 0, 247, 360)
  if (Weather === 'rain') {
    Wctx.fillStyle = lerpc(S.bot, '#ffffff', 0.5); Wctx.globalAlpha = 0.75
    RainHi.forEach((d) => { d[1] += d[2]; if (d[1] > 380) { d[1] = -d[3]; d[0] = Math.random() * 247 } Wctx.fillRect(d[0] | 0, d[1] | 0, 2, d[3] | 0) })
    Wctx.globalAlpha = 1
  }
  Wctx.globalCompositeOperation = 'destination-in'; Wctx.drawImage(WinMask, 0, 0)
  // 바닥 창빛 : 밤은 달빛 (그림 그대로), 낮 · 노을은 햇빛 색, 흐리면 옅게
  Pctx.globalCompositeOperation = 'source-over'; Pctx.clearRect(0, 0, 400, 105)
  const Sun = 1 - S.night
  if (Sun > 0.02 && Weather !== 'rain') {
    Pctx.globalAlpha = Sun * (Weather === 'clear' ? 0.55 : 0.25)
    Pctx.fillStyle = Hour > 17 || Hour < 7 ? '#ffb07a' : '#ffeccc'; Pctx.fillRect(0, 0, 400, 105)
    Pctx.globalAlpha = 1; Pctx.globalCompositeOperation = 'destination-in'; Pctx.drawImage(PatchMask, 0, 0)
  }
  // 천둥 : 비 오는 밤에 가끔
  if (Weather === 'rain' && t > NextBolt) { NextBolt = t + 9000 + Math.random() * 14000; Flash.animate([{ opacity: 0 }, { opacity: 0.7 }, { opacity: 0.1 }, { opacity: 0.5 }, { opacity: 0 }], { duration: 600, easing: 'steps(5)' }) }
}

// 고양이 꼬리 살랑 : 4 ~ 8 초마다 한 번. 몸 쪽 (오른쪽 끝) 은 그대로, 끝으로 갈수록 더 휘어 올라간다
let TailPix = null
const TailEl = document.getElementById('tailpix'), TailCtx = TailEl.getContext('2d')
const bendTail = (Amp) => {
  if (!TailPix) return
  TailCtx.clearRect(0, 0, 58, 34)
  TailPix.forEach(([x, y, c]) => {
    const T = Math.max(0, (52 - x) / 46)
    TailCtx.fillStyle = c; TailCtx.fillRect(x, y - Math.round(Amp * T * T), 1, 1)
  })
}
// 높이 (칸) 의 흐름 : 들렸다 → 살짝 내려갔다 → 한 번 더 까딱 → 제자리
const SwishKeys = [[0, 0], [0.3, 4], [0.55, -1], [0.78, 2.5], [1, 0]]
const swish = () => {
  const T0 = performance.now(), Dur = 1400
  const step = (Now) => {
    const P = Math.min(1, (Now - T0) / Dur)
    let i = 0
    while (i < SwishKeys.length - 2 && SwishKeys[i + 1][0] <= P) i++
    const [Pa, Va] = SwishKeys[i], [Pb, Vb] = SwishKeys[i + 1], K = (P - Pa) / (Pb - Pa), E = K * K * (3 - 2 * K)
    bendTail(Va + (Vb - Va) * E)
    if (P < 1) requestAnimationFrame(step)
  }
  requestAnimationFrame(step)
  setTimeout(swish, 4000 + Math.random() * 4000)
}
setTimeout(swish, 2500)

// 확대 전 방향키 : 여자애 패드의 누른 쪽 버튼이 반짝인다 (그림은 움직이지 않는다)
const PadEl = document.getElementById('pad'), PadCtx = PadEl.getContext('2d')
let PadBusy = 0, PadBase = null
const press = (Dir) => {
  if (!PadBase) PadBase = PadCtx.getImageData(0, 0, 96, 72)
  clearTimeout(PadBusy)
  PadCtx.clearRect(0, 0, 96, 72)
  // 왼쪽 방향키 자리 (26, 29) · 오른쪽 버튼 자리 (68, 23)
  const [Bx, By] = Dir < 0 ? [26, 29] : [68, 23]
  const dot = (x, y, c) => { PadCtx.fillStyle = c; PadCtx.fillRect(x, y, 1, 1) }
  const frame = (k) => {
    PadCtx.clearRect(0, 0, 96, 72)
    // 가운데 불빛 + 둘레 은은한 빛
    PadCtx.fillStyle = 'rgba(255, 214, 120, 0.35)'; PadCtx.fillRect(Bx - 2, By - 2, 6, 6)
    PadCtx.fillStyle = '#fff1a8'; PadCtx.fillRect(Bx, By, 2, 2)
    // 십자 반짝임 : 한 번 퍼졌다가 줄어든다
    const R = k === 1 ? 4 : 3
    ;[[0, -R], [0, R + 1], [-R, 0], [R + 1, 0]].forEach(([x, y]) => dot(Bx + x, By + y, k === 1 ? '#fff6d0' : 'rgba(255, 240, 190, 0.6)'))
  }
  frame(0)
  setTimeout(() => frame(1), 60)
  setTimeout(() => frame(2), 130)
  PadBusy = setTimeout(() => PadCtx.clearRect(0, 0, 96, 72), 220)
}
addEventListener('keydown', (e) => {
  if (Zoomed || Open >= 0) return
  if (e.key === 'ArrowLeft') press(-1)
  if (e.key === 'ArrowRight') press(1)
})

// 목업 조절기
const HourIn = document.getElementById('hour'), Clock = document.getElementById('clock')
const showClock = () => { HourIn.value = Hour; const H = Math.floor(Hour) % 24, M = Math.round((Hour % 1) * 60); Clock.textContent = `${String(H).padStart(2, '0')}:${String(M).padStart(2, '0')}` }
HourIn.addEventListener('input', () => { Hour = +HourIn.value; Follow = false; document.querySelector('[data-t=now]').setAttribute('aria-pressed', false); showClock() })
const PhaseIn = document.getElementById('phase'); PhaseIn.value = MoonPhase
PhaseIn.addEventListener('input', () => { MoonPhase = +PhaseIn.value; Follow = false; document.querySelector('[data-t=now]').setAttribute('aria-pressed', false) })
document.querySelector('[data-t=now]').onclick = (e) => { Follow = true; MoonPhase = realPhase(); PhaseIn.value = MoonPhase; const D = new Date(); Hour = D.getHours() + D.getMinutes() / 60; e.target.setAttribute('aria-pressed', true); showClock() }
document.querySelectorAll('[data-w]').forEach((b) => b.addEventListener('click', () => {
  document.querySelectorAll('[data-w]').forEach((x) => x.setAttribute('aria-pressed', x === b))
  WeatherMode = b.dataset.w
  if (WeatherMode === 'real') fetchWeather(); else Weather = WeatherMode
}))
showClock()
setInterval(() => { if (Follow) { const D = new Date(); Hour = D.getHours() + D.getMinutes() / 60 } showClock() }, 30000)
const loop = (t) => { place(); drawLabel(Games[Index].en); drawSky(t || 0); requestAnimationFrame(loop) }
requestAnimationFrame(loop)
requestAnimationFrame(() => setTimeout(() => document.body.classList.add('ready'), 60))
</script>

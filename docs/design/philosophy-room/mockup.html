<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>철학 방 목업</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Noto+Serif+KR:wght@700&display=swap" rel="stylesheet" />
<style>
  :root { --ease: cubic-bezier(0.22, 1, 0.36, 1); }
  * { box-sizing: border-box; }
  body { margin: 0; background: #1a1a1a; color: #e0e0e0; display: grid; gap: 48px; padding: 48px 24px; justify-items: center; }
  .screen { position: relative; width: min(1280px, 100%); aspect-ratio: 16 / 9; overflow: hidden; background: #000; }
  .screen > img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .abs { position: absolute; }

  /* 공용 버튼 : 홈 + 뒤로가기 */
  .btn { position: absolute; left: 16px; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: #e0e0e0; background: rgba(255,255,255,.08); backdrop-filter: blur(8px); font-size: 20px; z-index: 5; }
  .btn.home { top: 16px; } .btn.back { top: 68px; }

  /* 갈림길 아치 */
  .arch { cursor: pointer; }
  .arch .inner { position: absolute; inset: 4% 7% -22%; border-radius: 50% 50% 0 0 / 24% 24% 0 0; backdrop-filter: brightness(1) saturate(1); transition: backdrop-filter .8s var(--ease); }
  .arch .spill { position: absolute; inset: -30% -55% -40%; pointer-events: none; mix-blend-mode: screen; opacity: 0; transition: opacity .8s var(--ease);
    background: radial-gradient(ellipse 30% 38% at 50% 46%, rgba(255,206,140,.5), rgba(255,180,100,.22) 55%, transparent 80%),
                radial-gradient(ellipse 46% 20% at 50% 75%, rgba(255,205,135,.5), rgba(255,180,100,.2) 50%, transparent 80%),
                radial-gradient(ellipse 70% 30% at 50% 86%, rgba(255,190,110,.2), transparent 74%); }
  .arch .inner { --m1: linear-gradient(to bottom, #000 66%, rgba(0,0,0,.28) 78%, transparent 92%); --m2: linear-gradient(to right, transparent, #000 10%, #000 90%, transparent);
    -webkit-mask-image: var(--m1), var(--m2); mask-image: var(--m1), var(--m2); -webkit-mask-composite: source-in; mask-composite: intersect; }
  .arch:hover .inner { backdrop-filter: brightness(1.7) saturate(1.1); }
  .arch:hover .spill { opacity: 1; }

  /* 문 */
  .door { cursor: pointer; perspective: 1200px; overflow: hidden; container-type: inline-size; }
  .door .behind { position: absolute; inset: 0; background:
      radial-gradient(ellipse 70% 32% at 50% 0%, rgba(255,214,160,.22), transparent 70%),
      linear-gradient(#2b2118, #1d160f 70%, #2a1f15); }
  .door .glow { position: absolute; inset: 0; background: radial-gradient(ellipse 60% 18% at 50% 100%, rgba(255,207,138,.4), transparent 75%); opacity: 0; transition: opacity .6s var(--ease); }
  .door .leaf { position: absolute; top: 0; bottom: 0; width: 50%; background-repeat: no-repeat; transition: transform .6s var(--ease); }
  .door .leaf.l { left: 0; } .door .leaf.r { right: 0; }
  .west .door { border-radius: 50% 50% 0 0 / 22% 22% 0 0; }
  .west .door .leaf.l { transform-origin: left center; }
  .west .door .leaf.r { transform-origin: right center; }
  .west .door:hover .leaf.l { transform: rotateY(72deg); }
  .west .door:hover .leaf.r { transform: rotateY(-72deg); }
  .east .door:hover .leaf.l { transform: translateX(-100%); }
  .east .door:hover .leaf.r { transform: translateX(100%); }
  .door:hover .glow { opacity: 1; }
  .floorglow { pointer-events: none; background: radial-gradient(ellipse at 50% 0%, rgba(255,200,120,.35), transparent 70%); opacity: 0; transition: opacity .6s var(--ease); }

  /* 문틈 너머 전시실 벽의 이름 : 문이 다 열린 뒤 떠오른다 */
  .door .title { position: absolute; left: 0; right: 0; top: 34%; text-align: center; color: rgba(246,236,220,.95); text-shadow: 0 0 10px rgba(255,210,150,.25); opacity: 0; transition: opacity .5s var(--ease) 0s; pointer-events: none; }
  .door:hover .title { opacity: 1; transition-delay: .12s; }
  .west .door .title { font-family: Cinzel, serif; font-weight: 600; letter-spacing: 0; font-size: 6.4cqw; }
  .east .door .title { font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: 20cqw; }
  /* 모바일 : 호버가 없으니 문 앞 바닥에 이름을 늘 보인다 */
  .floortitle { display: none; position: absolute; text-align: center; color: rgba(255,240,215,.75); text-shadow: 0 1px 6px rgba(0,0,0,.7); pointer-events: none; }
  .phone .floortitle { display: block; }
  .east .floortitle { font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: 22px; }

  /* 전시실 : 불 꺼진 방 + 스포트라이트 */
  .room .dark { filter: brightness(.22); }
  @property --sa { syntax: '<number>'; inherits: true; initial-value: 0; }
  .room { --sa: 0; transition: --sa .7s var(--ease); }
  .room.spot { transition: --sa .45s var(--ease); }
  .room .lit { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(1.08);
    -webkit-mask-image: var(--beam), var(--pool); mask-image: var(--beam), var(--pool);
    -webkit-mask-composite: source-in; mask-composite: intersect; opacity: var(--sa); }
  .room .beam { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen; opacity: calc(var(--sa) * .35);
    -webkit-mask-image: var(--beam), var(--pool); mask-image: var(--beam), var(--pool); -webkit-mask-composite: source-in; mask-composite: intersect;
    background: linear-gradient(to bottom, rgba(255,232,190,.4), rgba(255,220,160,.12)); }
  .frame { cursor: pointer; padding: .7%; border-radius: 1px; opacity: .3; transition: opacity .7s var(--ease); }
  .frame.on { opacity: 1; }
  .frame { --wood: #5a3a22; --wood2: #3e2615; --wood3: #6e4a2c;
    background:
      repeating-linear-gradient(92deg, rgba(0,0,0,.18) 0 1px, transparent 1px 4px),
      repeating-linear-gradient(88deg, rgba(255,230,200,.06) 0 2px, transparent 2px 9px),
      linear-gradient(90deg, var(--wood2), var(--wood3) 30%, var(--wood) 55%, var(--wood2) 80%, var(--wood3));
    box-shadow: inset 0 1px 0 rgba(255,220,180,.25), inset 0 -2px 2px rgba(0,0,0,.5), 0 6px 16px rgba(0,0,0,.6); }
  .frame .canvas { box-shadow: inset 0 0 0 1px rgba(0,0,0,.6), inset 0 2px 6px rgba(0,0,0,.55); }
  .east .frame { --wood: #3a2416; --wood2: #24150c; --wood3: #4a2f1c; }
  .frame .canvas { width: 100%; height: 100%; background: radial-gradient(ellipse at 50% 38%, #b48a5c 0 16%, transparent 17%), radial-gradient(ellipse at 50% 92%, #5a3a22 0 38%, transparent 39%), linear-gradient(#3a2a1c, #1f150d); }
  .frame.empty .canvas { background: #d9d0bf; }
  .frame { container-type: inline-size; }
  .label { position: absolute; left: 0; right: 0; top: calc(100% + 3px); text-align: center; white-space: nowrap; color: rgba(255,244,226,.95); text-shadow: 0 1px 3px rgba(0,0,0,.85); font-family: Cinzel, serif; font-weight: 600; letter-spacing: 0; font-size: min(12px, 11cqw); opacity: 0; transition: opacity .4s var(--ease); }
  .east .label { font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: min(15px, 18cqw); }
  .frame.on .label { opacity: 1; }

  /* 모바일 */
  .phone { width: 390px; height: 844px; border-radius: 36px; border: 10px solid #2a2a2a; overflow-x: auto; overflow-y: hidden; position: relative; background: #000; }
  .phone .pan { position: relative; aspect-ratio: 16 / 9; height: 100%; }
  .phone .btn { position: sticky; float: left; margin: 16px 0 0 16px; }
  .phone .pan > img { width: 100%; height: 100%; object-fit: cover; }
</style>
</head>
<body>

<!-- 1. 갈림길 -->
<section class="screen">
  <img class="bg" src="IMG_01-crossroads" alt="" />
  <a class="btn home" aria-label="홈으로">⌂</a>
  <div class="abs arch" style="left:10%;top:14%;width:22%;height:60%"><div class="spill"></div><div class="inner"></div></div>
  <div class="abs arch" style="left:68%;top:14%;width:24%;height:60%"><div class="spill"></div><div class="inner"></div></div>
</section>

<!-- 2. 서양관 홀 / 3. 동양관 홀 : 문은 스크립트로 채운다 -->
<section class="screen west" data-hall="west"><img class="bg" src="IMG_02-west-hall" alt="" /><a class="btn home">⌂</a><a class="btn back">←</a></section>
<section class="screen east" data-hall="east"><img class="bg" src="IMG_03-east-hall" alt="" /><a class="btn home">⌂</a><a class="btn back">←</a></section>

<!-- 4. 고대 전시실 / 5. 중세 전시실 (빈 방) -->
<section class="screen room west" data-room="ancient"><img class="bg dark" src="IMG_10-west-ancient" alt="" /><img class="lit" src="IMG_10-west-ancient" alt="" /><div class="beam"></div><a class="btn home">⌂</a><a class="btn back">←</a></section>
<section class="screen room west" data-room="medieval"><img class="bg dark" src="IMG_11-west-medieval" alt="" /><img class="lit" src="IMG_11-west-medieval" alt="" /><div class="beam"></div><a class="btn home">⌂</a><a class="btn back">←</a></section>
<section class="screen room east" data-room="confucian"><img class="bg dark" src="IMG_20-east-confucian" alt="" /><img class="lit" src="IMG_20-east-confucian" alt="" /><div class="beam"></div><a class="btn home">⌂</a><a class="btn back">←</a></section>

<!-- 6. 모바일 : 동양관 홀, 가운데에서 시작해 좌우로 끌어 본다 -->
<div class="phone" id="phone"><div class="pan east" data-hall="east" data-phone><img src="IMG_03-east-hall" alt="" /></div></div>

<script>
  const Doors = {
    west: [[6.4,17.6,15.6,58.4],[31.4,21.6,14.3,54],[54.3,21.6,14.3,54],[78,17.6,15.6,58.4]],
    east: [[10,32.5,12.3,39.5],[33.5,35,11.5,36.5],[55.4,35,11.1,36.5],[77.8,32.5,12.2,39.5]],
  }
  const Labels = { west: ['ANCIENT','MEDIEVAL','MODERN','CONTEMPORARY'], east: ['儒','道','佛','百'] }
  const Rooms = { west: ['IMG_10-west-ancient','IMG_11-west-medieval','IMG_12-west-modern','IMG_13-west-contemporary'], east: ['IMG_20-east-confucian','IMG_21-east-daoist','IMG_22-east-buddhist','IMG_23-east-hundred'] }

  document.querySelectorAll('[data-hall]').forEach((S) => {
    const wing = S.dataset.hall
    const hallSrc = S.querySelector('img').src
    Doors[wing].forEach(([x, y, w, h], i) => {
      const D = document.createElement('div')
      D.className = 'abs door'
      Object.assign(D.style, { left: x + '%', top: y + '%', width: w + '%', height: h + '%' })
      const bgSize = `${(100 / w) * 100}% ${(100 / h) * 100}%`
      const leaf = (side, offX) => `<div class="leaf ${side}" style="background-image:url(${hallSrc});background-size:${(100 / (w / 2)) * 100}% ${(100 / h) * 100}%;background-position:${((x + offX) / (100 - w / 2)) * 100}% ${(y / (100 - h)) * 100}%"></div>`
      D.innerHTML = `<div class="behind"></div><div class="glow"></div><div class="title">${Labels[wing][i]}</div>` + leaf('l', 0) + leaf('r', w / 2)
      const P = document.createElement('div')
      P.className = 'floortitle'
      Object.assign(P.style, { left: x + '%', top: y + h + 3 + '%', width: w + '%' })
      P.textContent = Labels[wing][i]
      const F = document.createElement('div')
      F.className = 'abs floorglow'
      Object.assign(F.style, { left: x - w * 0.3 + '%', top: y + h + '%', width: w * 1.6 + '%', height: '18%' })
      D.addEventListener('mouseenter', () => { F.style.opacity = 1 })
      D.addEventListener('mouseleave', () => { F.style.opacity = 0 })
      S.append(F, D, P)
    })
  })

  // 전시실 : hang.ts 와 같은 규칙으로 계산한 자리
  const Walls = { ancient: [12,12,76,46], medieval: [12,10,74,54], confucian: [16,11,68,47] }
  const People = {
    ancient: [['SOCRATES',3],['PLATO',3],['ARISTOTLE',3],['THALES',1],['PYTHAGORAS',1],['HERACLITUS',1],['PARMENIDES',1],['DEMOCRITUS',1]],
    medieval: [],
    confucian: [['孔子',3],['孟子',3],['荀子',3],['朱熹',2],['李滉',2],['李珥',2]],
  }
  const WidthOf = { 3: .16, 2: .11, 1: .07 }
  const rng = (seed) => () => { seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296 }
  const seedOf = (It) => { let h = 2166136261; for (const c of It.map((i) => i.id ?? '_').join('|')) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0 }
  const hang = (list, [wx, wy, ww, wh]) => {
    const Items = (list.length ? list.map(([l, wt]) => ({ id: l, l, wt })) : [{ id: null, l: null, wt: 2 }, { id: null, l: null, wt: 2 }, { id: null, l: null, wt: 2 }]).sort((a, b) => b.wt - a.wt)
    const seed = seedOf(Items), top = Math.max(...Items.map((i) => i.wt)), cx = wx + ww / 2, cy = wy + wh / 2
    const close = (a, b) => { const gx = Math.min(a.w, b.w) * .22, gy = wh * .05; return a.x < b.x + b.w + gx && b.x < a.x + a.w + gx && a.y < b.y + b.h + gy && b.y < a.y + a.h + gy }
    for (let s = 1; s > .05; s *= .93) {
      const rand = rng(seed), Out = []
      let ok = true
      for (const it of Items) {
        const k = it.wt === top ? 1 : 1 + (rand() * 2 - 1) * .08, w = ww * WidthOf[it.wt] * s * k, h = w * 1.25 * 16 / 9
        if (Items.length === 1) { Out.push({ ...it, x: cx - w / 2, y: cy - h / 2, w, h }); continue }
        const yr = it.wt === top ? wh * .12 : (wh - h) / 2
        const dist = (a, b) => Math.hypot(a.x + a.w / 2 - b.x - b.w / 2, (a.y + a.h / 2 - b.y - b.h / 2) / (16 / 9))
        let P = null, best = -1, found = 0
        for (let t = 0; t < 400 && found < 48; t++) {
          const R = { x: wx + rand() * (ww - w), y: cy - h / 2 + (rand() * 2 - 1) * yr, w, h }
          if (R.y < wy || R.y + h > wy + wh || Out.some((o) => close(o, R))) continue
          found++
          const near = Out.length ? Math.min(...Out.map((o) => dist(o, R))) : ww
          const sc = near + Math.min(Math.min(R.x - wx, wx + ww - R.x - w), ww * .04)
          if (sc > best) { best = sc; P = R }
        }
        if (!P) { ok = false; break }
        Out.push({ ...it, ...P })
      }
      if (ok) return Out
    }
    return []
  }
  document.querySelectorAll('[data-room]').forEach((S) => {
    const room = S.dataset.room
    // 천장 조명 (사진 위 3%) 에서 액자로 내려오는 원뿔과, 액자를 감싸는 벽의 빛 웅덩이
    const aim = (f) => {
      const R = S.getBoundingClientRect()
      const cx = (f.x + f.w / 2) / 100 * R.width, top = .03 * R.height
      const X = f.x + f.w / 2, Top = 3, End = Math.min(96, f.y + f.h * 1.9)
      const cxp = X / 100 * R.width, topp = Top / 100 * R.height, midp = (f.y + f.h / 2) / 100 * R.height
      // 원뿔 : 액자 높이에서 폭이 액자 폭의 1.5배가 되도록, 가장자리는 넓게 흐린다
      const a = Math.atan2((f.w / 100 * R.width) * .75, midp - topp) * 180 / Math.PI, soft = a * .45
      S.style.setProperty('--beam', `conic-gradient(from ${180 - a}deg at ${cxp}px ${topp}px, transparent 0deg, #000 ${soft}deg, #000 ${a * 2 - soft}deg, transparent ${a * 2}deg)`)
      // 길이 : 조명에서 액자 아래까지 내려와 둥글게 사라지는 긴 타원
      S.style.setProperty('--pool', `radial-gradient(ellipse ${f.w * 1.6}% ${(End - Top) / 2 + 2}% at ${X}% ${(Top + End) / 2}%, #000 0%, #000 62%, rgba(0,0,0,.45) 82%, transparent 100%)`)
    }
    hang(People[room], Walls[room]).forEach((f) => {
      const F = document.createElement('div')
      F.className = 'abs frame' + (f.l ? '' : ' empty')
      Object.assign(F.style, { left: f.x + '%', top: f.y + '%', width: f.w + '%', height: f.h + '%' })
      F.innerHTML = `<div class="canvas"></div>` + (f.l ? `<div class="label">${f.l}</div>` : '')
      F.addEventListener('mouseenter', () => { aim(f); S.classList.add('spot'); S.style.setProperty('--sa', 1); F.classList.add('on') })
      F.addEventListener('mouseleave', () => { S.classList.remove('spot'); S.style.setProperty('--sa', 0); F.classList.remove('on') })
      S.append(F)
    })
  })
  const Ph = document.getElementById('phone'); Ph.scrollLeft = (Ph.scrollWidth - Ph.clientWidth) / 2
</script>
</body>
</html>

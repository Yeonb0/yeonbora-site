<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>펼친 화면 · 블록</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 800px; overflow: hidden; box-sizing: border-box; background: {{bg}}; color: {{ink}}; font-family: 'NanumSquare Neo', 'NanumSquare', 'Noto Sans KR', sans-serif">
  <div style="height: 100%; box-sizing: border-box; padding: 48px 56px 56px; display: flex; flex-direction: column; gap: 28px">
    <span style="font-size: 200px; font-weight: 900; line-height: .8; letter-spacing: -0.05em">{{n}}</span>
    <div style="flex: 1 1 0; min-height: 0; display: flex; gap: 10px">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
        <section style="flex: 1 1 0; min-width: 0; box-sizing: border-box; padding: 36px 30px; background: {{g.tone}}; color: {{g.fg}}; display: flex; flex-direction: column; gap: 22px">
          <h2 style="margin: 0; font-size: 30px; font-weight: 900">{{g.label}}</h2>
          <ul style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: minmax(0, 1fr); gap: {{g.gap}}px">
            <sc-for list="{{g.items}}" as="c" hint-placeholder-count="5">
              <li><a href="#" style="color: #ffffff; font-size: {{g.fs}}px; line-height: 1.35; text-decoration: none">{{c.name}}</a></li>
            </sc-for>
          </ul>
        </section>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;year&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;1&quot;,&quot;2&quot;,&quot;3&quot;,&quot;4&quot;,&quot;5&quot;],&quot;default&quot;:&quot;1&quot;},&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800}}">
class Component extends DCLogic {
  renderVals() {
    const Raw = {
      1: { bg: '#FFB400', ink: '#000000', list: ['현대동아시아의형성', '성찰과성장', '알바트로스세미나', '동서고전세미나', '독일언어와문화I', '동양철학개론', '논리학개론', '세계종교입문', '프랑스언어와문화I', '한국철학사', '서양고대철학사', '소크라테스이전철학과소크라테스철학', '한국그리스도교의이해', '중국문화속의유교와도교', '법과지식재산'] },
      2: { bg: '#7209B7', ink: '#ffffff', list: ['문화유산현장실습1', '서양철학사', '플라톤철학', '근현대중국철학사2', '힌두교의이해', '고대근동의종교', '도교의중심사상', '철학적인간학', '독일언어와문화II', '아리스토텔레스철학', '위진·당철학사', '힌두교강독', '과학사', '기초인공지능프로그래밍', '인문사회글쓰기'] },
      3: { bg: '#3A0CA3', ink: '#ffffff', list: ['기초C언어', '도가철학', '유가철학', '칸트철학', '종교의이해', '미적분학I', '이산구조', '디지털회로개론', 'JAVA언어', '자료구조', '선형대수학', '종교학답사I', '디지털 시대의 종교', '종교연구방법론'] },
      4: { bg: '#4361EE', ink: '#ffffff', list: ['컴퓨터시스템개론', '컴퓨터아키텍처', '프로그래밍언어', '기초머신러닝', '기초컴퓨터그래픽스', '컴퓨터네트워크', '알고리즘설계와분석', '운영체제', '기초컴파일러구성', '소프트웨어공학', '실전 AI 에이전트 시스템 설계 · 구축', '종교간의대화', '그리스도교강독'] },
      5: { bg: '#4CC9F0', ink: '#000000', list: ['데이터베이스시스템', '시스템프로그래밍', 'Creative Solution'] }
    };
    const Cat = {
      phil: ['동양철학개론', '논리학개론', '한국철학사', '서양고대철학사', '소크라테스이전철학과소크라테스철학', '서양철학사', '플라톤철학', '근현대중국철학사2', '아리스토텔레스철학', '위진·당철학사', '도가철학', '유가철학', '칸트철학'],
      rel: ['세계종교입문', '한국그리스도교의이해', '중국문화속의유교와도교', '힌두교의이해', '고대근동의종교', '도교의중심사상', '힌두교강독', '종교의이해', '종교학답사I', '디지털 시대의 종교', '종교연구방법론', '종교간의대화', '그리스도교강독'],
      cse: ['기초C언어', '이산구조', '디지털회로개론', 'JAVA언어', '자료구조', '컴퓨터시스템개론', '컴퓨터아키텍처', '프로그래밍언어', '기초머신러닝', '기초컴퓨터그래픽스', '컴퓨터네트워크', '알고리즘설계와분석', '운영체제', '기초컴파일러구성', '소프트웨어공학', '실전 AI 에이전트 시스템 설계 · 구축', '데이터베이스시스템', '시스템프로그래밍']
    };
    const Groups = [
      { key: 'gen', label: '교양', tone: '#000000' },
      { key: 'phil', label: '철학', tone: '#7A1E3A' },
      { key: 'rel', label: '종교학', tone: '#1E5E4A' },
      { key: 'cse', label: '컴퓨터공학', tone: '#1F2A44' }
    ];
    const catOf = (c) => (Cat.phil.includes(c) ? 'phil' : Cat.rel.includes(c) ? 'rel' : Cat.cse.includes(c) ? 'cse' : 'gen');
    const groupsOf = (n) => Groups.map((g) => ({ ...g, items: Raw[n].list.filter((c) => catOf(c) === g.key).map((c) => ({ name: c, bg: g.tone, h: 150 + Math.min(c.length, 14) * 12 })) }));
    const n = Number(this.props.year ?? '2');
    const G = groupsOf(n).filter((g) => g.items.length).map((g, i) => {
      const light = ['#FFB400', '#4CC9F0'].includes(Raw[n].bg);
      const gi = Groups.findIndex((x) => x.key === g.key);
      let t = light ? [0.38, 0.5, 0.62, 0.74][gi] : [0.12, 0.24, 0.36, 0.48][gi];
      let mix = light ? 0 : 255;
      if (n === 2) t = [0.28, 0.36, 0.42, t][gi];
      if (n === 4 && gi === 2) { t = 0.3; mix = 0; }
      if (n === 4 && gi === 3) t = 0.34;
      const rgb = [1, 3, 5].map((k) => Math.round(parseInt(Raw[n].bg.slice(k, k + 2), 16) * (1 - t) + mix * t));
      const lum = (0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2]) / 255;
      const long = g.items.length > 8;
      return { ...g, fs: long ? 19 : 22, gap: long ? 8 : 14, tone: `rgb(${rgb.join(', ')})`, fg: '#ffffff' };
    });
    return { n, bg: Raw[n].bg, ink: Raw[n].ink, groups: G };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>펼친 화면 · 책장</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 800px; overflow: hidden; box-sizing: border-box; background: {{bg}}; color: {{ink}}; font-family: 'NanumSquare Neo', 'NanumSquare', 'Noto Sans KR', sans-serif">
  <span style="position: absolute; left: 56px; top: 40px; font-size: 220px; font-weight: 900; line-height: .8; letter-spacing: -0.06em">{{n}}</span>
  <div style="position: absolute; left: 56px; right: 56px; bottom: 56px; display: flex; align-items: flex-end; gap: 40px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; gap: 12px">
        <ul style="margin: 0; padding: 0; list-style: none; display: flex; align-items: flex-end; gap: 6px">
          <sc-for list="{{g.items}}" as="c" hint-placeholder-count="5">
            <li><a href="#" style="display: block; width: 48px; height: {{c.sh}}px; box-sizing: border-box; padding: 16px 0; background: {{c.bg}}; color: #ffffff; writing-mode: vertical-rl; font-size: 15px; line-height: 48px; text-decoration: none; overflow: hidden">{{c.name}}</a></li>
          </sc-for>
        </ul>
        <div style="height: 6px; background: currentColor"></div>
        <h2 style="margin: 0; font-size: 17px; font-weight: 900">{{g.label}}</h2>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"year":{"editor":"enum","options":["1","2","3","4","5"],"default":"2"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const Raw = {
      1: { bg: '#FFB400', ink: '#000000', list: ['현대동아시아의형성', '성찰과성장', '알바트로스세미나', '동서고전세미나', '독일언어와문화I', '동양철학개론', '논리학개론', '세계종교입문', '프랑스언어와문화I', '한국철학사', '서양고대철학사', '소크라테스이전철학과소크라테스철학', '한국그리스도교의이해', '중국문화속의유교와도교', '법과지식재산'] },
      2: { bg: '#7209B7', ink: '#ffffff', list: ['문화유산현장실습1', '서양철학사', '플라톤철학', '근현대중국철학사2', '힌두교의이해', '고대근동의종교', '도교의중심사상', '철학적인간학', '독일언어와문화II', '아리스토텔레스철학', '위진·당철학사', '힌두교강독', '과학사', '기초인공지능프로그래밍', '인문사회글쓰기'] },
      3: { bg: '#3A0CA3', ink: '#ffffff', list: ['기초C언어', '도가철학', '유가철학', '칸트철학', '종교의이해', '미적분학I', '이산구조', '디지털회로개론', 'JAVA언어', '자료구조', '선형대수학', '종교학답사I', '디지털 시대의 종교', '종교연구방법론'] },
      4: { bg: '#4361EE', ink: '#ffffff', list: ['컴퓨터시스템개론', '컴퓨터아키텍처', '프로그래밍언어', '기초머신러닝', '기초컴퓨터그래픽스', '컴퓨터네트워크', '알고리즘설계와분석', '운영체제', '기초컴파일러구성', '소프트웨어공학', '실전 AI 에이전트 시스템 설계 · 구축', '종교간의대화', '그리스도교강독'] },
      5: { bg: '#4CC9F0', ink: '#000000', list: ['데이터베이스시스템', '시스템프로그래밍', 'Creative Solution'] }
    };
    const Cat = {
      phil: ['동양철학개론', '논리학개론', '한국철학사', '서양고대철학사', '소크라테스이전철학과소크라테스철학', '서양철학사', '플라톤철학', '근현대중국철학사2', '아리스토텔레스철학', '위진·당철학사', '도가철학', '유가철학', '칸트철학'],
      rel: ['세계종교입문', '한국그리스도교의이해', '중국문화속의유교와도교', '힌두교의이해', '고대근동의종교', '도교의중심사상', '힌두교강독', '종교의이해', '종교학답사I', '디지털 시대의 종교', '종교연구방법론', '종교간의대화', '그리스도교강독'],
      cse: ['기초C언어', '이산구조', '디지털회로개론', 'JAVA언어', '자료구조', '컴퓨터시스템개론', '컴퓨터아키텍처', '프로그래밍언어', '기초머신러닝', '기초컴퓨터그래픽스', '컴퓨터네트워크', '알고리즘설계와분석', '운영체제', '기초컴파일러구성', '소프트웨어공학', '실전 AI 에이전트 시스템 설계 · 구축', '데이터베이스시스템', '시스템프로그래밍']
    };
    const Groups = [
      { key: 'gen', label: '교양', tone: '#000000' },
      { key: 'phil', label: '철학', tone: '#7A1E3A' },
      { key: 'rel', label: '종교학', tone: '#1E5E4A' },
      { key: 'cse', label: '컴퓨터공학', tone: '#1F2A44' }
    ];
    const catOf = (c) => (Cat.phil.includes(c) ? 'phil' : Cat.rel.includes(c) ? 'rel' : Cat.cse.includes(c) ? 'cse' : 'gen');
    const groupsOf = (n) => Groups.map((g) => ({ ...g, items: Raw[n].list.filter((c) => catOf(c) === g.key).map((c) => ({ name: c, bg: g.tone, h: 150 + Math.min(c.length, 14) * 12 })) })).filter((g) => g.items.length);
    const n = Number(this.props.year ?? '2');
    const G = groupsOf(n).map((g) => ({ ...g, items: g.items.map((c) => ({ ...c, sh: 52 + c.name.length * 16 })) }));
    return { n, bg: Raw[n].bg, ink: Raw[n].ink, groups: G };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>펼친 화면 · 쌓인 책</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
.book{touch-action:none;user-select:none;-webkit-user-select:none}
</style>
</helmet>
<div ref="{{setRoot}}" data-root="1" style="position: relative; width: 1280px; height: 800px; overflow: hidden; background: {{bg}}; color: {{ink}}; font-family: 'NanumSquare Neo', 'NanumSquare', 'Noto Sans KR', sans-serif; cursor: {{cursor}}">
  <span style="position: absolute; left: 56px; top: 40px; font-size: 200px; font-weight: 900; line-height: .8; letter-spacing: -0.05em">{{n}}</span>
  <div style="position: absolute; left: 56px; right: 56px; bottom: 40px; display: flex; align-items: flex-end; gap: 48px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
      <div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 14px">
        <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column-reverse; gap: 3px">
          <sc-for list="{{g.items}}" as="b" hint-placeholder-count="5">
            <li class="book" ref="{{b.ref}}" data-book="{{b.name}}" onPointerDown="{{b.down}}" style="width: {{b.w}}%; margin-left: {{b.ml}}%; cursor: grab; opacity: {{b.op}}">
              <a href="#" draggable="false" style="display: block; box-sizing: border-box; padding: 10px 18px; background: {{b.bg}}; color: #ffffff; border-radius: 3px; box-shadow: inset 8px 0 0 rgba(255, 255, 255, 0.14), inset -8px 0 0 rgba(0, 0, 0, 0.14); font-size: {{g.fs}}px; font-weight: 700; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-decoration: none">{{b.name}}</a>
            </li>
          </sc-for>
        </ul>
        <div style="height: 6px; background: currentColor; opacity: .85"></div>
        <h2 style="margin: 0; font-size: 28px; font-weight: 900">{{g.label}}</h2>
      </div>
    </sc-for>
  </div>
  <sc-if value="{{held}}" hint-placeholder-val="{{false}}">
    <div aria-hidden="true" style="position: absolute; left: {{hx}}px; top: {{hy}}px; width: {{hw}}px; box-sizing: border-box; padding: 10px 18px; background: {{hbg}}; color: #ffffff; border-radius: 3px; box-shadow: inset 8px 0 0 rgba(255, 255, 255, 0.14), inset -8px 0 0 rgba(0, 0, 0, 0.14), 0 16px 28px rgba(0, 0, 0, 0.35); font-size: {{hfs}}px; font-weight: 700; line-height: 1.3; white-space: nowrap; overflow: hidden; transform: rotate(-3deg); pointer-events: none; z-index: 10">{{hname}}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;year&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;1&quot;,&quot;2&quot;,&quot;3&quot;,&quot;4&quot;,&quot;5&quot;],&quot;default&quot;:&quot;4&quot;},&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800}}">
class Component extends DCLogic {
  units(name) {
    let u = 0;
    for (const ch of name) u += ch === ' ' ? 0.35 : ch.charCodeAt(0) < 128 ? 0.6 : 1;
    return u;
  }
  ordered(key, items) {
    const O = (this.state && this.state.order && this.state.order[key]) || items.map((c) => c.name).sort((a, b) => this.units(b) - this.units(a));
    return O.map((name) => items.find((c) => c.name === name)).filter(Boolean);
  }
  el(x) {
    const hit = this.els && this.els[x];
    if (hit && hit.isConnected) return hit;
    return this.rootEl ? this.rootEl.querySelector(`[data-book="${CSS.escape(x)}"]`) : null;
  }
  scale() {
    const r = this.rootEl.getBoundingClientRect();
    return { r, k: r.width / 1280 || 1 };
  }
  grab(e, name, key, bg, fs) {
    if (e.button !== undefined && e.button !== 0) return;
    this.rootEl = this.rootEl || e.currentTarget.closest('[data-root]');
    if (!this.rootEl) return;
    e.preventDefault();
    const { r, k } = this.scale();
    const b = e.currentTarget.getBoundingClientRect();
    const u = e.currentTarget.parentElement.getBoundingClientRect();
    this.setState({ drag: { name, key, offX: (e.clientX - b.left) / k, offY: (e.clientY - b.top) / k, x: (e.clientX - r.left) / k, y: (e.clientY - r.top) / k, w: b.width / k, uL: (u.left - r.left) / k, uW: u.width / k, bg, fs } });
    const move = (ev) => this.drag(ev);
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      const d = this.state && this.state.drag;
      if (!d) return;
      const pct = Math.max(0, Math.min(100 - (d.w / d.uW) * 100, ((d.x - d.offX - d.uL) / d.uW) * 100));
      this.setState({ drag: null, shift: { ...((this.state && this.state.shift) || {}), [d.key + d.name]: pct } });
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  }
  drag(ev) {
    const cur = this.state && this.state.drag;
    if (!cur || !this.rootEl) return;
    const { r, k } = this.scale();
    const next = { drag: { ...cur, x: (ev.clientX - r.left) / k, y: (ev.clientY - r.top) / k } };
    const O = this.cache[cur.key] || [];
    const others = O.filter((x) => x !== cur.name);
    const idx = others.filter((x) => {
      const el = this.el(x);
      if (!el) return false;
      const b = el.getBoundingClientRect();
      return b.top + b.height / 2 > ev.clientY;
    }).length;
    const N = [...others];
    N.splice(idx, 0, cur.name);
    if (N.join('|') !== O.join('|') && Date.now() > (this.lockUntil || 0)) {
      this.prevPos = {};
      O.forEach((x) => { const el = this.el(x); if (el) this.prevPos[x] = el.getBoundingClientRect().top; });
      this.k = k;
      this.lockUntil = Date.now() + 120;
      next.order = { ...((this.state && this.state.order) || {}), [cur.key]: N };
    }
    this.setState(next);
  }
  componentDidUpdate() {
    if (!this.prevPos) return;
    const P = this.prevPos;
    this.prevPos = null;
    Object.keys(P).forEach((x) => {
      const el = this.el(x);
      if (!el) return;
      const dy = (P[x] - el.getBoundingClientRect().top) / (this.k || 1);
      if (Math.abs(dy) < 0.5) return;
      el.style.transition = 'none';
      el.style.transform = `translateY(${dy}px)`;
      el.getBoundingClientRect();
      el.style.transition = 'transform 220ms cubic-bezier(.2, .7, .2, 1)';
      el.style.transform = '';
    });
  }
  renderVals() {
    const Raw = {
      1: { bg: '#FFB400', ink: '#000000', list: ['현대동아시아의형성', '성찰과성장', '알바트로스세미나', '동서고전세미나', '독일언어와문화I', '동양철학개론', '논리학개론', '세계종교입문', '프랑스언어와문화I', '한국철학사', '서양고대철학사', '소크라테스이전철학과소크라테스철학', '한국그리스도교의이해', '중국문화속의유교와도교', '법과지식재산'] },
      2: { bg: '#7209B7', ink: '#ffffff', list: ['문화유산현장실습1', '서양철학사', '플라톤철학', '근현대중국철학사2', '힌두교의이해', '고대근동의종교', '도교의중심사상', '철학적인간학', '독일언어와문화II', '아리스토텔레스철학', '위진·당철학사', '힌두교강독', '과학사', '기초인공지능프로그래밍', '인문사회글쓰기'] },
      3: { bg: '#3A0CA3', ink: '#ffffff', list: ['기초C언어', '도가철학', '유가철학', '칸트철학', '종교의이해', '미적분학I', '이산구조', '디지털회로개론', 'JAVA언어', '자료구조', '선형대수학', '종교학답사I', '디지털 시대의 종교', '종교연구방법론'] },
      4: { bg: '#4361EE', ink: '#ffffff', list: ['컴퓨터시스템개론', '컴퓨터아키텍처', '프로그래밍언어', '기초머신러닝', '기초컴퓨터그래픽스', '컴퓨터네트워크', '알고리즘설계와분석', '운영체제', '기초컴파일러구성', '소프트웨어공학', '실전 AI 에이전트 시스템 설계 · 구축', '종교간의대화', '그리스도교강독'] },
      5: { bg: '#4CC9F0', ink: '#000000', list: ['데이터베이스시스템', '시스템프로그래밍', 'Creative Solution'] }
    };
    const Cat = {
      phil: ['동양철학개론', '논리학개론', '한국철학사', '서양고대철학사', '소크라테스이전철학과소크라테스철학', '서양철학사', '플라톤철학', '근현대중국철학사2', '아리스토텔레스철학', '위진·당철학사', '도가철학', '유가철학', '칸트철학'],
      rel: ['세계종교입문', '한국그리스도교의이해', '중국문화속의유교와도교', '힌두교의이해', '고대근동의종교', '도교의중심사상', '힌두교강독', '종교의이해', '종교학답사I', '디지털 시대의 종교', '종교연구방법론', '종교간의대화', '그리스도교강독'],
      cse: ['기초C언어', '이산구조', '디지털회로개론', 'JAVA언어', '자료구조', '컴퓨터시스템개론', '컴퓨터아키텍처', '프로그래밍언어', '기초머신러닝', '기초컴퓨터그래픽스', '컴퓨터네트워크', '알고리즘설계와분석', '운영체제', '기초컴파일러구성', '소프트웨어공학', '실전 AI 에이전트 시스템 설계 · 구축', '데이터베이스시스템', '시스템프로그래밍']
    };
    const Groups = [
      { key: 'gen', label: '교양', tone: '#000000' },
      { key: 'phil', label: '철학', tone: '#7A1E3A' },
      { key: 'rel', label: '종교학', tone: '#1E5E4A' },
      { key: 'cse', label: '컴퓨터공학', tone: '#1F2A44' }
    ];
    const catOf = (c) => (Cat.phil.includes(c) ? 'phil' : Cat.rel.includes(c) ? 'rel' : Cat.cse.includes(c) ? 'cse' : 'gen');
    const groupsOf = (n) => Groups.map((g) => ({ ...g, items: Raw[n].list.filter((c) => catOf(c) === g.key).map((c) => ({ name: c, bg: g.tone, h: 150 + Math.min(c.length, 14) * 12 })) })).filter((g) => g.items.length);
    const n = Number(this.props.year ?? '1');
    const light = ['#FFB400', '#4CC9F0'].includes(Raw[n].bg);
    const shade = (t, mix) => `rgb(${[1, 3, 5].map((k) => Math.round(parseInt(Raw[n].bg.slice(k, k + 2), 16) * (1 - t) + mix * t)).join(', ')})`;
    const M = [3, 9, 1, 13, 6, 11, 0, 8];
    const S = this.state || {};
    const d = S.drag;
    this.cache = {};
    this.els = this.els || {};
    const Gs = groupsOf(n);
    const pileW = (1168 - 48 * (Gs.length - 1)) / Gs.length;
    const G = Gs.map((g) => {
      const gi = Groups.findIndex((x) => x.key === g.key);
      let base = light ? [0.38, 0.5, 0.62, 0.74][gi] : [0.12, 0.24, 0.36, 0.48][gi];
      let mix = light ? 0 : 255;
      if (n === 2) base = [0.28, 0.36, 0.42, base][gi];
      if (n === 4 && gi === 2) { base = 0.3; mix = 0; }
      if (n === 4 && gi === 3) base = 0.34;
      const fs = g.items.length > 8 ? 16 : 18;
      const key = n + g.key;
      const list = this.ordered(key, g.items);
      this.cache[key] = list.map((c) => c.name);
      const bg = shade(base, mix);
      return {
        ...g,
        fs,
        items: list.map((c, i) => {
          const w = Math.min(100, Math.max(50, Math.round(((this.units(c.name) * fs + 96) / pileW) * 100)));
          return {
            name: c.name,
            w,
            ml: S.shift && S.shift[key + c.name] != null ? Math.min(S.shift[key + c.name], 100 - w) : Math.max(0, Math.min(M[i % 8], 100 - w)),
            bg,
            op: d && d.name === c.name ? 0.15 : 1,
            ref: (el) => { if (el) this.els[c.name] = el; },
            down: (e) => this.grab(e, c.name, key, bg, fs)
          };
        })
      };
    });
    return {
      n, bg: Raw[n].bg, ink: Raw[n].ink, groups: G,
      setRoot: (el) => { if (el) this.rootEl = el; },
      held: !!d, hx: d ? d.x - d.offX : 0, hy: d ? d.y - d.offY : 0, hw: d ? d.w : 0, hbg: d ? d.bg : '#000', hfs: d ? d.fs : 18, hname: d ? d.name : '',
      cursor: d ? 'grabbing' : 'default'
    };
  }
}
</script>
</body>
</html>
